.rolegate-brand .brandmark svg{color:#34d399;width:22px;height:22px}

.rolegate-brand small{color:#94a3b8;font-size:12px}
.rolegate-session{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;background:#10b9811f;color:#6ee7b7;border:1px solid #10b98140}
.rolegate-session i{width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block}
.rolegate-hero{text-align:center;max-width:640px;margin:0 auto;padding:48px 10px 8px}
.rolegate-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;background:#10b98117;border:1px solid #10b9812e;color:#6ee7b7;font-size:12px;font-weight:650;margin-bottom:18px}

.rolegate-hero p{color:#cbd5e1cc;margin:16px 0 0;font-size:14.5px;line-height:1.7}
.rolecards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1080px;width:100%;margin:36px auto 0}

.rolecard[data-tone="green"]{--tone:#34d399;--tonebg:#10b98126;--toneborder:#34d39955}
.rolecard[data-tone="amber"]{--tone:#fbbf24;--tonebg:#f59e0b26;--toneborder:#fbbf2455}
.rolecard[data-tone="sky"]{--tone:#38bdf8;--tonebg:#0ea5e926;--toneborder:#38bdf855}
.rolecard:hover{border-color:var(--toneborder)}
.rolecard-glow{position:absolute;top:-36px;right:-36px;width:140px;height:140px;border-radius:50%;background:var(--tonebg);filter:blur(30px);pointer-events:none;transition:background .3s}
.rolecard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.rolecard-icon{width:52px;height:52px;border-radius:14px;background:var(--tonebg);border:1px solid var(--toneborder);color:var(--tone);display:grid;place-items:center}
.rolecard-icon svg{width:24px;height:24px}
.rolecard-tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:var(--tonebg);color:var(--tone);border:1px solid var(--toneborder)}
.rolecard h3{font-size:18px;margin:0 0 8px;font-weight:750;color:#fff}
.rolecard p{font-size:13px;color:#cbd5e1b3;line-height:1.65;margin:0}
.rolecard-foot{margin-top:22px;padding-top:14px;border-top:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:650;color:var(--tone)}
.rolecard-foot .arrow{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;transition:transform .2s}
.rolecard:hover .rolecard-foot .arrow{transform:translateX(4px)}
.rolegate-support{text-align:center;margin:28px auto 0}
.rolegate-support span{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:#6ee7b7d9;padding:9px 20px;border-radius:99px;background:#ffffff08;border:1px solid #ffffff14}
.rolegate-footer{margin-top:auto;padding-top:22px;border-top:1px solid #ffffff14;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:11.5px;color:#94a3b8}
.rolegate-footer strong{color:#e2e8f0}

function scoreBadge(score){if(score===undefined||score===null)return '';const tone=score>=80?'green':score>=40?'amber':'red';const val=Math.round(score*100)/100,text=val===100?'100':val.toFixed(2);return `<span class="badge ${tone}">${text}%</span>`;}
function parseCsvRows(text){const rows=[];let row=[],field='',inQuotes=false;for(let i=0;i<text.length;i++){const c=text[i];if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}else field+=c;}else if(c==='"')inQuotes=true;else if(c===','){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}else field+=c;}if(field||row.length){row.push(field);rows.push(row);}return rows;}
function parseRumusanCsv(text){
 const rows=parseCsvRows(text);
 const validStandards=new Set(CATALOG.standards.map(s=>s.id));
 const validItems=new Set(aspects.flatMap(a=>a.items.map(i=>i.id)));
 const out=[];let currentStandard='';
 rows.forEach(r=>{
  const a=String(r[0]||'').trim(),cRaw=String(r[2]||'').trim();
  const cNum=cRaw===''?null:Number(cRaw);
  const stdMatch=a.match(/^STANDARD\s+([\d.]+)/i);
  if(stdMatch){currentStandard=stdMatch[1];return;}
  if(/^PERATUS SKOR$/i.test(a)){if(cNum!==null&&!isNaN(cNum)&&validStandards.has(currentStandard))out.push({id:currentStandard,level:'standard',score:cNum});return;}
  if(/^\d+(\.\d+){2,}$/.test(a)&&cNum!==null&&!isNaN(cNum)&&validItems.has(a))out.push({id:a,level:'item',score:cNum});
 });
 return out;
}

function modal(title,body,submitText='Simpan',handler){$('#modal').innerHTML=`<form id="modalform"><div class="modalhead"><h2>${title}</h2><button type="button" class="plain" id="closemodal" aria-label="Tutup">${icon('close')}</button></div><div class="modalbody">${body}<div class="error formerror" id="formerror" role="alert"></div></div><div class="modalfoot"><button type="button" id="cancelmodal">Batal</button>${handler?`<button class="primary" type="submit">${submitText}</button>`:''}</div></form>`;$('#closemodal').onclick=$('#cancelmodal').onclick=()=>$('#modal').close();$('#modalform').onsubmit=async ev=>{ev.preventDefault();const btn=$('#modalform button[type=submit]');btn.disabled=true;$('#formerror').textContent='';try{await handler(new FormData(ev.target));$('#modal').close();render();toast('Rekod berjaya disimpan.');}catch(e){$('#formerror').textContent=errorText(e);}finally{btn.disabled=false;}};if(!$('#modal').open)$('#modal').showModal();}
function field(label,name,value='',attrs=''){return `<label class="field">${label}<input name="${name}" value="${esc(value)}" ${attrs}></label>`;}
function datalist(id,values){return `<datalist id="${id}">${(values||[]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;}
const lines=t=>String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
function optionList(values,selected){return values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function chooseEvidence(aspect){const es=records().filter(e=>canEdit(e));modal('Eviden untuk aspek '+aspect,`<p class="muted">Daftarkan bukti baharu atau tambah pemetaan pada dokumen yang sudah tersedia.</p><button type="button" class="primary" id="newForAspect">${icon('plus')} Daftar eviden baharu</button>${es.length?`<label class="field" style="margin-top:22px">Guna eviden sedia ada<select id="reuse"><option value="">Pilih dokumen…</option>${es.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label>`:''}`);$('#newForAspect').onclick=()=>evidenceForm(null,aspect);if($('#reuse'))$('#reuse').onchange=e=>{if(e.target.value)evidenceForm(db.evidence.find(x=>x.id===e.target.value),aspect);};}
function evidenceForm(existing,initialAspect='',management=false,initialActionIds=[]){let e=existing||{name:'',date:'',category:'Laporan',source:'Pautan dokumen',status:'Draf',unit:'',url:'',management,year};let ms=existing?structuredClone(mappingsFor(e.id)):[];if(initialAspect&&!ms.some(m=>m.aspectId===initialAspect))ms.push({aspectId:initialAspect,actionIds:[...initialActionIds],pdca:[],reference:'',note:''});if(!ms.length&&!management&&!e.management)ms.push({aspectId:CATALOG.standards.find(s=>s.id===selected).aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});
 modal(existing?'Ubah eviden':'Tambah eviden',`${field('Nama dokumen sebenar *','name',e.name,'required maxlength="200" placeholder="Contoh: Minit Mesyuarat Kurikulum Bil. 1/2025"')}<div class="grid2"><label class="field">Kategori<select name="category">${optionList(['Laporan','Minit mesyuarat','Maklum balas','Memo','Surat','Pelan / ketetapan','Analisis','Rekod pemantauan','Lain-lain'],e.category)}</select></label></div>${field('Panitia / unit / kelab','unit',e.unit,'maxlength="120" list="unitlist" placeholder="Contoh: Panitia Bahasa Melayu"')}${datalist('unitlist',db.settings.units)}<div class="grid2"><label class="field">Sumber eviden<select id="source" name="source">${['Pautan dokumen','Aplikasi BASIS','Muat naik fail','Fail Keras'].map(v=>`<option value="${v}" ${v===e.source?'selected':''}>${sourceLabel(v)}</option>`).join('')}</select></label><label class="field" id="appfield">Aplikasi sekolah<select name="appId"><option value="">Pilih aplikasi…</option>${db.apps.map(a=>`<option value="${a.id}" ${e.appId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div><label class="field" id="urlfield">Pautan dokumen / rekod khusus<input name="url" type="url" placeholder="Tampal pautan di sini" value="${esc(safeURL(e.url))}"><small>Gunakan pautan rekod atau laporan yang boleh dibuka oleh penyemak.</small></label><label class="field">Catatan<textarea name="catatan" maxlength="1200" placeholder="Nota tambahan (pilihan)">${esc(e.catatan||'')}</textarea><small>Pilihan — nota ringkas untuk rujukan dalaman.</small></label><label class="field uploadbox" id="filefield">Muat naik fail<input type="file" id="evidencefile" accept=".pdf,.png,.jpg,.jpeg,.webp"><small>PDF / PNG / JPG / WebP · Maksimum ${live?'5':'1'} MB${e.fileName?' · Sedia ada: '+esc(e.fileName):''}</small></label><label class="check"><input type="checkbox" name="management" ${e.management?'checked':''}> Paparkan dalam Fail Pengurusan SK@S</label><div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px"><h3>Pemetaan aspek & PDCA</h3><button type="button" id="addmapping">${icon('plus')} Aspek</button></div><p class="smallhint">Pilih tindakan yang dibuktikan. Cadangan PDCA boleh diubah; ia bukan skor rasmi.</p><div id="mappings"></div>`, 'Simpan eviden', async fd=>{
  collectMappings();let url=fd.get('url').trim(),fileName=e.fileName||'',fileId=e.fileId||'';const src=fd.get('source'),isFile=fd.get('management')==='on';
  if(!ms.length&&!isFile)throw Error('Pilih sekurang-kurangnya satu aspek.');
  if(ms.some(m=>!m.actionIds.length||!m.pdca.length))throw Error('Setiap pemetaan memerlukan tindakan, tag PDCA .');
  if(src==='Aplikasi BASIS'&&!fd.get('appId'))throw Error('Pilih aplikasi sekolah.');
  if(src==='Muat naik fail'){const file=$('#evidencefile').files[0];if(file){const result=await upload(file,live?5:1);url=result.url;fileId=result.fileId;fileName=result.name;}else if(e.source==='Muat naik fail'&&e.url)url=e.url;else throw Error('Pilih fail untuk dimuat naik.');}else if(url&&!safeURL(url))throw Error('Masukkan pautan HTTPS yang sah.');
  db=await api('saveEvidence',{id:e.id||'',version:e.version||0,name:fd.get('name').trim(),date:'',category:fd.get('category'),unit:fd.get('unit').trim(),source:src,appId:src==='Aplikasi BASIS'?fd.get('appId'):'',url,fileId,fileName,catatan:fd.get('catatan').trim(),management:isFile,status:'Draf',year:e.year||year,mappings:ms});
 });
 function collectMappings(){ms=$$('.mapping').map(el=>({aspectId:el.querySelector('.mapaspect').value,actionIds:[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value),pdca:[...el.querySelectorAll('.pdcacheck:checked')].map(x=>x.value),reference:'',note:''}));}
 function drawMappings(){$('#mappings').innerHTML=ms.map((m,idx)=>{const a=aspects.find(a=>a.id===m.aspectId)||aspects[0];return `<div class="mapping"><div class="maphead"><span>Pemetaan ${idx+1}</span><button type="button" class="plain removemap" data-index="${idx}">Buang</button></div><label class="field">Aspek<select class="mapaspect">${aspects.map(a=>`<option value="${a.id}" ${a.id===m.aspectId?'selected':''}>${a.id} · ${esc(a.name)}</option>`).join('')}</select></label><div class="field"><span>Tindakan yang disokong *</span><div class="actionlist">${a.items.map(i=>`<p class="smallhint"><b>${i.id}</b> ${esc(i.name)}</p>${i.actions.map(t=>`<label class="check" style="margin:7px 0"><input class="actioncheck" type="checkbox" value="${t.id}" ${m.actionIds.includes(t.id)?'checked':''}>${esc(t.label)}</label>`).join('')}`).join('')}</div></div><div class="checks">${Object.keys(pdcaNames).map(p=>`<label class="check"><input class="pdcacheck" type="checkbox" value="${p}" ${m.pdca.includes(p)?'checked':''}>${p} · ${pdcaNames[p]}</label>`).join('')}</div></div>`;}).join('');$$('.mapaspect').forEach((s,i)=>s.onchange=()=>{collectMappings();ms[i].actionIds=[];ms[i].pdca=[];drawMappings();});$$('.actioncheck').forEach(c=>c.onchange=()=>{const el=c.closest('.mapping');const ids=[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value);const tags=allActions.filter(a=>ids.includes(a.id)).map(a=>a.pdca);el.querySelectorAll('.pdcacheck').forEach(x=>x.checked=tags.includes(x.value));});$$('.removemap').forEach(b=>b.onclick=()=>{collectMappings();ms.splice(Number(b.dataset.index),1);drawMappings();});}
 $('#addmapping').onclick=()=>{collectMappings();ms.push({aspectId:aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});drawMappings();};drawMappings();
 const setSource=()=>{const s=$('#source').value;$('#appfield').style.display=s==='Aplikasi BASIS'?'grid':'none';$('#filefield').style.display=s==='Muat naik fail'?'grid':'none';$('#urlfield').style.display=(s==='Muat naik fail'||s==='Fail Keras')?'none':'grid';$('#urlfield input').required=false;};$('#source').onchange=setSource;setSource();
}
function detailForm(e){const rows=mappingsFor(e.id).map(m=>{const a=aspects.find(x=>x.id===m.aspectId);const acts=allActions.filter(x=>m.actionIds.includes(x.id));return `<div class="mapping" style="margin-top:15px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><strong>Aspek ${m.aspectId}${a?' · '+esc(a.name):''}</strong>${sourceLinkBtn(e)}</div>${acts.length?`<ul style="margin:8px 0 0;padding-left:18px">${acts.map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul>`:''}${m.pdca.length?`<div class="pdca" style="margin-top:8px">${m.pdca.map(p=>`<span class="${p}">${p} · ${pdcaNames[p]}</span>`).join('')}</div>`:''}</div>`;}).join('');modal('Butiran eviden',`<h3>${esc(e.name)}</h3><p class="muted">${esc(e.category)}${e.unit?' · '+esc(e.unit):''}</p><h4 style="margin:18px 0 0">Pemetaan aspek &amp; PDCA</h4>${rows||'<p class="smallhint">Tiada pemetaan aspek.</p>'}${e.catatan?`<div class="note" style="margin-top:15px">${icon('info')}<span>${esc(e.catatan)}</span></div>`:''}`);}
function ppsForm(p={}){modal(p.id?'Ubah PPS':'Daftar PPS',`${field('Nama *','name',p.name,'required maxlength="100"')}${field('E-mel Google (untuk akses PPS)','email',p.email,'type="email" maxlength="150"')}${field('Jawatan *','position',p.position,'required maxlength="100" list="positionlist" placeholder="Contoh: Setiausaha Kurikulum"')}${datalist('positionlist',db.settings.positions)}<p class="smallhint">Tahun ${year} · Pilih semua aspek tanggungjawab.</p>${aspects.map(a=>`<label class="check" style="margin:9px 0"><input name="aspects" type="checkbox" value="${a.id}" ${p.aspects?.includes(a.id)?'checked':''}>${a.id} · ${esc(a.name)}</label>`).join('')}`,'Simpan PPS',async fd=>{if(!fd.getAll('aspects').length)throw Error('Pilih sekurang-kurangnya satu aspek.');db=await api('savePps',{id:p.id||'',name:fd.get('name').trim(),email:fd.get('email').trim().toLowerCase(),position:fd.get('position').trim(),year,aspects:fd.getAll('aspects')});});}
function appForm(a={}){modal(a.id?'Ubah aplikasi':'Daftar aplikasi sekolah',`${field('Nama aplikasi *','name',a.name,'required maxlength="120"')}${field('Pautan aplikasi *','url',a.url,'type="url" required placeholder="Tampal pautan di sini"')}<label class="field">Fungsi aplikasi *<textarea name="description" required maxlength="800">${esc(a.description||'')}</textarea></label>`,'Simpan aplikasi',async fd=>{if(!safeURL(fd.get('url')))throw Error('Gunakan pautan HTTPS yang sah.');db=await api('saveApp',{id:a.id||'',name:fd.get('name').trim(),url:fd.get('url'),description:fd.get('description').trim(),owner:a.owner||''});});}
async function readFile(file,limit,imagesOnly=false){const types=imagesOnly?['image/png','image/jpeg','image/webp']:['image/png','image/jpeg','image/webp','application/pdf'];if(!types.includes(file.type))throw Error('Format fail tidak disokong.');if(file.size>limit*1024*1024)throw Error(`Saiz fail melebihi ${limit} MB.`);return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Fail tidak dapat dibaca.'));r.readAsDataURL(file);});}
async function upload(file,limit){const dataUrl=await readFile(file,limit);return api('upload',{name:file.name,mime:file.type,dataUrl});}
function bindSettings(){let logo=db.settings.logo;if($('#loadSeed'))$('#loadSeed').onclick=async e=>{e.target.disabled=true;try{const before=db.evidence.length;db=await api('loadSeed',{year});render();toast((db.evidence.length-before)+' cadangan eviden ditambah.');}catch(err){e.target.disabled=false;toast(errorText(err));}};$('#logo').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;logo=await readFile(f,1,true);$('#logopreview').innerHTML=`<img src="${logo}" alt="Pratonton logo sekolah">`;$('#settingserror').textContent='';}catch(err){$('#settingserror').textContent=errorText(err);e.target.value='';logo=db.settings.logo;}};$('#settingsform').onsubmit=async ev=>{ev.preventDefault();const btn=ev.target.querySelector('button[type=submit]');btn.disabled=true;try{const fd=new FormData(ev.target);const links=lines(fd.get('navLinks')).map(l=>{const i=l.indexOf('|');if(i<0)throw Error('Pautan "'+l+'" perlu format: Label | https://alamat');return [l.slice(0,i).trim(),l.slice(i+1).trim()];});db=await api('settings',{school:fd.get('school').trim(),code:fd.get('code').trim(),year:Number(fd.get('year')),logo,openAccess:db.settings.openAccess,schoolType:fd.get('schoolType'),units:lines(fd.get('units')),positions:lines(fd.get('positions')),navLinks:links,folderUrl:fd.get('folderUrl').trim()});year=Number(db.settings.year);render();toast('Profil sekolah berjaya dikemas kini.');}catch(e){$('#settingserror').textContent=errorText(e);}finally{btn.disabled=false;}};if($('#openAccessToggle'))$('#openAccessToggle').onchange=async e=>{const checked=e.target.checked;e.target.disabled=true;try{db=await api('settings',{school:db.settings.school,code:db.settings.code,year:db.settings.year,logo:db.settings.logo,openAccess:checked});render();toast(checked?'Akses terbuka diaktifkan.':'Akses terbuka dimatikan.');}catch(err){e.target.checked=!checked;e.target.disabled=false;toast(errorText(err));}};
 if($('#rumusanFile'))$('#rumusanFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#rumusanError').textContent='';try{const csv=await f.text();db=await api('importRumusanSkor',{csv});toast(`${(db.rumusanSkor||[]).length} rekod skor diimport.`);render();}catch(err){$('#rumusanError').textContent=errorText(err);e.target.value='';}};
}

function roleGate(){
 const brand=logoSource(db.settings?.logo),school=esc(db.settings?.school||'Sekolah'),y=Number(db.settings?.year)||new Date().getFullYear();

  <div class="rolegate-footer"><div><strong>SKPM Kualiti@Sekolah</strong> · Portal Eviden SK@S</div><div>${school} · Sesi ${y}</div></div>
 </div></div>`;
 const choose=async role=>{try{db=await api('load',{guestRole:role});if(db.needsRole)throw Error('Peranan tidak sah.');guestRole=role;afterLoad();}catch(e){toast(errorText(e));}};

Promise.resolve().then(start);

// Additional portal components use the same authenticated Sheets API.
const componentNames={strength:['Guru','Kualiti Pengajaran dan Pembelajaran (PdP)','Staf Bukan Guru','Prasarana Akademik','Prasarana Sukan dan Kokurikulum','Prasarana Hal Ehwal Murid','Persekitaran Digital','Asrama','Sokongan Ibu Bapa/Penjaga, Komuniti dan Pihak Swasta']};
const outcomeCats=[['Kemenjadian Murid dalam Akademik',50],['Kemenjadian Murid dalam Kokurikulum',15],['Kemenjadian Sahsiah Murid',15],['Pencapaian Guru',10],['Pencapaian Sekolah',10]];
function outcomeValue(i){const r=(db.components||[]).find(r=>r.key==='outcomes-'+i&&Number(r.year)===year);return r?Number(r.value)||0:0;}
function scoreCard(label,val,max,badge){const pct=max?Math.round(val/max*1000)/10:0;return `<section class="panel scorecard"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span class="badge green">${badge}</span><div style="font-size:20px;font-weight:750;color:var(--green)">${pct}%</div></div><h3 style="margin-top:12px">${esc(label)}</h3><div class="scoreval">${val.toFixed(2)}<small>/${max}</small></div></section>`;}
function outcomeCard(i,vals,tone){const c=outcomeCats[i];const r=(db.components||[]).find(r=>r.key==='outcomes-'+i&&Number(r.year)===year);const pct=Math.round(vals[i]/c[1]*1000)/10;const clr=tone==='amber'?'#a9791f':'var(--green)';return `<section class="panel apptile${tone==='amber'?' amber':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span class="badge ${tone}">K${i+1}</span><div style="font-size:24px;font-weight:750;color:${clr}">${pct}%</div></div><h2 style="margin-top:12px">${esc(c[0])}</h2><div class="scoreval">${vals[i].toFixed(2)}<small>/${c[1]}</small></div><div class="actions">${r?.url?link(r.url,'Buka pautan',true):''}${admin()?`<button class="iconbtn" onclick="outcomeForm(${i})" title="Kemas kini skor" aria-label="Kemas kini skor">${icon('edit')}</button>`:''}</div></section>`;}

// Modul Instrumen "Pengurusan Kami" (Std 1–3). Data dari state_.instrumen; semua semakan akses diulang di pelayan.
let insStd='1',insMine=false,insSesi=null,insUnitTab='';
const INS_STATUS_TONE={'Belum diisi':'','Draf':'amber','Dihantar':'sky','Disahkan':'green','Perlu pembetulan':'red'};
navs.splice(navs.findIndex(n=>n[0]==='management')+1,0,['instrumen','Instrumen Pengurusan','check']);
navGroups[0].items.splice(navGroups[0].items.indexOf('management')+1,0,'instrumen');

const ins=()=>db.instrumen;
const insYear=()=>ins().settings.year;
const insSesiNow=()=>insSesi||ins().settings.sesi;
const insRoleAdmin=()=>db.user.role==='Admin';
const insUnitAspect=id=>!!ins().unitAspects[id];
const insActions=item=>item.actions.filter(t=>!ins().excluded.includes(t.id)&&ins().rubric[t.id]);
const insCovers=(aspectId,itemId)=>db.user.role==='PPS'&&ins().myPps.some(p=>p.aspects.includes(aspectId)&&(!p.items.length||p.items.includes(itemId)));
const insCanFill=(aspectId,itemId,unitId)=>insRoleAdmin()||insCovers(aspectId,itemId)||!!(unitId&&insUnitAspect(aspectId)&&ins().settings.unitOpen);
const insCanReview=(aspectId,itemId,unitId)=>insRoleAdmin()||!!(unitId&&insCovers(aspectId,itemId));
const insNeedsName=()=>!['Admin','PPS'].includes(db.user.role);
const insUnits=aspectId=>ins().units.filter(u=>u.aspectId===aspectId&&(u.active===true||String(u.active)==='true'));
const insRecs=(itemId,unitId,sesi)=>ins().scores.filter(r=>r.itemId===itemId&&(r.unitId||'')===(unitId||'')&&Number(r.sesi)===Number(sesi??insSesiNow()));
function insName(){try{return localStorage.getItem('skas-ins-name')||'';}catch{return '';}}
function insSaveName(v){try{localStorage.setItem('skas-ins-name',v);}catch{}}

/** Sama dengan scoreFor_ di Rubrik.js; pelayan mengira semula semasa simpan. */
function insScore(rule,crit){const n={A3:3,B3:3,A4:4,B4:4,C4:4}[rule],c=new Set(crit).size,f=crit.includes(1);if(c===n)return 4;if(!c)return 0;if(rule==='C4')return c;if(rule==='B4')return f?c:0;if(rule==='B3')return c===2?(f?3:2):1;if(rule==='A3')return f?(c===2?3:2):1;return f?Math.max(c,2):1;}
function insStatus(recs,total){if(!recs.length)return 'Belum diisi';const s=recs.map(r=>r.status);if(s.includes('Perlu pembetulan'))return 'Perlu pembetulan';if(recs.length===total&&s.every(x=>x==='Disahkan'))return 'Disahkan';if(recs.length===total&&s.every(x=>x==='Dihantar'))return 'Dihantar';return 'Draf';}
function insBadge(st){return `<span class="badge ${INS_STATUS_TONE[st]||''}">${esc(st)}</span>`;}
/** Peratus keseluruhan = Σ skor ÷ (4 × tindakan diisi) × 100. */
function insPct(recs){return recs.length?Math.round(recs.reduce((t,r)=>t+Number(r.score||0),0)/(4*recs.length)*10000)/100:null;}
function insScope(filterFn,confirmed){const units=new Set(ins().units.filter(u=>u.active===true||String(u.active)==='true').map(u=>u.id));return ins().scores.filter(r=>Number(r.sesi)===insSesiNow()&&(!r.unitId||units.has(r.unitId))&&(!confirmed||r.status==='Disahkan')&&filterFn(r));}
function insTotal(items){return items.reduce((t,{a,i})=>t+insActions(i).length*(insUnitAspect(a.id)?insUnits(a.id).length:1),0);}
function insMeter(pct){return `<div class="ins-meter" title="${pct===null?'Belum diisi':pct+'%'}"><i style="width:${pct||0}%;background:${barColor(pct||0)}"></i></div>`;}
function insAllItems(){return CATALOG.standards.flatMap(s=>s.aspects.flatMap(a=>a.items.filter(i=>insActions(i).length).map(i=>({s,a,i}))));}

function instrumenPage(){
 if(!db.instrumen)return head('Komponen 02','Instrumen Pengurusan','Pengisian skor Instrumen SKPM Kualiti@Sekolah Std 1–3.')+`<div class="note">${icon('info')}<span>Modul instrumen hanya tersedia apabila portal disambungkan ke akaun Google sekolah.</span></div>`;
 const cfg=ins().settings,sesi=insSesiNow(),all=insAllItems();
 const curAll=insScope(()=>true,false),conf=insScope(()=>true,true),total=insTotal(all);
 const mineOnly=x=>!insMine||insCovers(x.a.id,x.i.id);
 const stds=CATALOG.standards.filter(s=>all.some(x=>x.s.id===s.id));
 const list=all.filter(x=>x.s.id===insStd&&mineOnly(x));
 const sesiOpts=Array.from({length:cfg.sesiCount},(_,k)=>k+1).map(k=>`<option value="${k}" ${k===sesi?'selected':''}>Sesi ${k}${k===cfg.sesi?' (semasa)':''}</option>`).join('');
 const editable=sesi===cfg.sesi||insRoleAdmin();
 let body=head('Komponen 02','Instrumen Pengurusan',`Pengisian skor Std 1–3 tahun ${cfg.year}. Tanda kriteria yang dipenuhi; skor dikira mengikut rubrik instrumen.`,`<label class="field" style="margin:0"><select id="insSesi" aria-label="Sesi">${sesiOpts}</select></label>`);
 if(Number(year)!==cfg.year)body+=`<div class="note" style="margin:0 0 16px">${icon('info')}<span>Instrumen menggunakan tahun penilaian aktif ${cfg.year}, bukan tahun ${year} yang dipilih di atas.</span></div>`;
 if(!editable)body+=`<div class="note" style="margin:0 0 16px">${icon('info')}<span>Sesi ${sesi} bukan sesi semasa. Paparan baca sahaja.</span></div>`;
 body+=`<div class="summary">${stat('Skor disahkan',insPct(conf)===null?'–':insPct(conf).toFixed(2)+'%',conf.length+' tindakan disahkan','check')}${stat('Skor semasa',insPct(curAll)===null?'–':insPct(curAll).toFixed(2)+'%','Termasuk draf','chart')}${stat('Tindakan diisi',curAll.length+' / '+total,'Merentas semua unit aktif','folder')}${stat('Pengisian unit',cfg.unitOpen?'Dibuka':'Ditutup','Ketua Panitia / guru penasihat','users')}</div>`;
 body+=`<div class="ins-std">${stds.map(s=>`<button data-ins-std="${s.id}" class="${s.id===insStd?'active':''}">Std ${s.id}</button>`).join('')}${db.user.role==='PPS'?`<label class="check" style="margin-left:auto"><input type="checkbox" id="insMine" ${insMine?'checked':''}> Item saya sahaja</label>`:''}</div>`;
 const byAspect={};list.forEach(x=>(byAspect[x.a.id]=byAspect[x.a.id]||{a:x.a,items:[]}).items.push(x));
 body+=Object.values(byAspect).map(({a,items})=>{
  const unitMode=insUnitAspect(a.id),units=unitMode?insUnits(a.id):[];
  return `<section class="panel" style="margin-bottom:16px"><div class="panelhead"><div><h3 style="margin:0">${a.id} ${esc(a.name)}</h3>${unitMode?`<small class="muted">${units.length} unit aktif · diisi untuk setiap unit</small>`:''}</div>${unitMode?`<button data-ins-matrix="${a.id}">${icon('grid')} Matriks unit</button>`:''}</div><div>${items.map(({i})=>{
   const n=insActions(i).length,recs=unitMode?insScope(r=>r.itemId===i.id,false):insRecs(i.id,'');
   const st=unitMode?`${units.filter(u=>insRecs(i.id,u.id).length).length}/${units.length} unit`:'';
   const pct=insPct(recs),ppsNames=db.pps.filter(p=>Number(p.year)===insYear()&&p.aspects.includes(a.id)&&(!(p.items||[]).length||p.items.includes(i.id))).map(p=>p.name);
   return `<div class="ins-item"><span class="aspectcode">${i.id}</span><div><h4>${esc(i.name)}</h4><small>${n} tindakan${ppsNames.length?' · PPS: '+esc(ppsNames.join(', ')):''}</small></div>${insMeter(pct)}<div style="display:flex;gap:8px;align-items:center">${unitMode?`<span class="badge">${st}</span>`:insBadge(insStatus(recs,n))}<button ${unitMode?`data-ins-matrix="${a.id}"`:`data-ins-item="${i.id}"`}>${pct===null?'':pct.toFixed(0)+'% · '}${unitMode?'Unit':insCanFill(a.id,i.id,'')&&editable?'Isi':'Lihat'}</button></div></div>`;}).join('')}</div></section>`;}).join('')||`<div class="empty">${insMine?'Tiada item yang ditugaskan kepada anda dalam standard ini. Nyahtanda "Item saya sahaja" untuk melihat semua.':'Tiada item untuk dipaparkan.'}</div>`;
 if(insRoleAdmin())body+=insAdminPanel();
 return body;
}
function insAdminPanel(){
 const cfg=ins().settings,ua=Object.keys(ins().unitAspects),aspectName=id=>aspects.find(a=>a.id===id)?.name||id;
 const cur=insUnitTab||ua[0];
 const rows=ins().units.filter(u=>u.aspectId===cur).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="grid2" style="margin-top:8px"><section class="panel"><div class="panelhead"><h2>Tetapan instrumen</h2></div><form id="insSettings" class="formbody"><div class="grid2"><label class="field">Bilangan sesi setahun<select name="sesiCount">${[2,3].map(k=>`<option ${k===cfg.sesiCount?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">Sesi semasa<select name="sesi">${[1,2,3].map(k=>`<option ${k===cfg.sesi?'selected':''}>${k}</option>`).join('')}</select></label></div><label class="check"><input type="checkbox" name="unitOpen" ${cfg.unitOpen?'checked':''}> Buka pengisian unit kepada Ketua Panitia / guru penasihat tanpa akaun</label><p class="smallhint">Hanya aspek 3.1.2, 3.2.2, 3.2.3 dan 3.2.4. Pengisi wajib menaip nama, dan setiap perubahan direkod. Tutup selepas tarikh akhir pengisian.</p><div class="error formerror" id="insSettingsError"></div><button class="primary" type="submit">${icon('check')} Simpan tetapan</button></form></section>
 <section class="panel"><div class="panelhead"><h2>Senarai unit ${cfg.year}</h2></div><div class="formbody"><label class="field">Aspek<select id="insUnitAspect">${ua.map(id=>`<option value="${id}" ${id===cur?'selected':''}>${id} ${esc(aspectName(id))}</option>`).join('')}</select></label>
 <table class="ins-matrix"><thead><tr><th>Unit</th><th>PIC</th><th>Aktif</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.pic||'–')}</td><td>${u.active===true||String(u.active)==='true'?'Ya':'Tidak'}</td><td><button data-ins-unit="${u.id}">Ubah</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Belum ada unit.</td></tr>'}</tbody></table>
 <label class="field" style="margin-top:14px">Tambah unit (satu nama setiap baris)<textarea id="insNewUnits" rows="4" placeholder="Bahasa Melayu&#10;Matematik&#10;Sains"></textarea></label><div class="ins-bar" style="justify-content:flex-start"><button class="primary" id="insAddUnits">${icon('plus')} Tambah</button><button id="insCopyUnits">Salin dari tahun ${cfg.year-1}</button></div><div class="error formerror" id="insUnitError"></div></div></section></div>`;
}

function insMatrix(aspectId){
 const a=aspects.find(x=>x.id===aspectId),items=a.items.filter(i=>insActions(i).length),units=insUnits(aspectId);
 const cell=(i,u)=>{const recs=insRecs(i.id,u.id),pct=insPct(recs);return `<td><button type="button" data-ins-cell="${i.id}|${u.id}">${insBadge(insStatus(recs,insActions(i).length))}${pct===null?'':' '+pct.toFixed(0)+'%'}</button></td>`;};
 modal(`${a.id} ${esc(a.name)} · Sesi ${insSesiNow()}`,units.length?`<p class="muted">Pilih unit untuk mengisi atau menyemak. ${ins().settings.unitOpen?'Pengisian unit sedang <b>dibuka</b>.':'Pengisian unit terbuka sedang <b>ditutup</b>.'}</p><div style="overflow:auto"><table class="ins-matrix"><thead><tr><th>Unit</th>${items.map(i=>`<th title="${esc(i.name)}">${i.id}</th>`).join('')}</tr></thead><tbody>${units.map(u=>`<tr><td><strong>${esc(u.name)}</strong>${u.pic?`<br><small class="muted">${esc(u.pic)}</small>`:''}</td>${items.map(i=>cell(i,u)).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada unit aktif untuk aspek ini. ${insRoleAdmin()?'Tambah unit di bahagian Senarai unit.':'Hubungi admin.'}</div>`);
 $$('[data-ins-cell]').forEach(b=>b.onclick=()=>{const [itemId,unitId]=b.dataset.insCell.split('|');insItemForm(itemId,unitId);});
}

function insItemForm(itemId,unitId=''){
 const x=insAllItems().find(v=>v.i.id===itemId),{a,i}=x,cfg=ins().settings,sesi=insSesiNow();
 const unit=unitId?ins().units.find(u=>u.id===unitId):null,acts=insActions(i),recs=insRecs(i.id,unitId);
 const status=insStatus(recs,acts.length),locked=status==='Disahkan';
 const fill=insCanFill(a.id,i.id,unitId)&&(sesi===cfg.sesi||insRoleAdmin())&&!locked;
 const review=insCanReview(a.id,i.id,unitId),R=ins().rubric,rn=['i','ii','iii','iv'];
 const evPool=db.evidence.filter(e=>Number(e.year)===cfg.year&&mappingsFor(e.id).some(m=>m.aspectId===a.id));
 const note=recs.find(r=>r.reviewNote)?.reviewNote;
 const card=t=>{const r=recs.find(v=>v.actionId===t.id),rb=R[t.id],crit=(r?.criteria||[]).map(Number),ev=r?.evidenceIds||[];
  const pool=[...evPool].sort((p,q)=>Number(mappingsFor(q.id).some(m=>m.actionIds.includes(t.id)))-Number(mappingsFor(p.id).some(m=>m.actionIds.includes(t.id))));
  const extra=ev.filter(id=>!pool.some(e=>e.id===id));
  return `<div class="ins-act ${fill?'':'locked'}" data-ins-act="${t.id}" data-version="${r?r.version:0}" data-rule="${rb.rule}"><div class="ins-acthead"><div><strong>${t.id.split(':')[1]}) ${esc(t.label)}</strong> <span class="pdca"><span class="${t.pdca}">${t.pdca}</span></span>${r?`<br><small class="muted">${esc(r.status)} · ${esc(r.filledByName||'')}</small>`:''}</div><div class="ins-score" data-ins-score>${r?r.score:'–'}</div></div>
  ${rb.criteria.map((c,k)=>`<label class="ins-crit"><input type="checkbox" value="${k+1}" ${crit.includes(k+1)?'checked':''} ${fill?'':'disabled'}><span>(${rn[k]}) ${esc(c)}</span></label>`).join('')}
  <label class="ins-crit"><input type="checkbox" data-ins-zero ${r&&!crit.length?'checked':''} ${fill?'':'disabled'}><span><i>Tiada kriteria dipenuhi (skor 0)</i></span></label>
  <small class="muted">Peraturan ${rb.rule}: ${esc(ins().rules[rb.rule])}</small>
  <div class="ins-ev">${pool.length?pool.map(e=>`<label title="${esc(e.name)}"><input type="checkbox" data-ins-ev value="${e.id}" ${ev.includes(e.id)?'checked':''} ${fill?'':'disabled'}>${esc(e.name.length>48?e.name.slice(0,46)+'…':e.name)}</label>`).join(''):'<small class="muted">Tiada eviden dipetakan ke aspek ini lagi.</small>'}${extra.map(id=>`<input type="hidden" data-ins-ev-keep value="${esc(id)}">`).join('')}</div>
  <label class="field" style="margin-top:8px">Catatan<textarea rows="2" maxlength="1200" data-ins-note ${fill?'':'disabled'}>${esc(r?.catatan||'')}</textarea></label></div>`;};
 const title=`${i.id} ${esc(i.name)}${unit?' · '+esc(unit.name):''}`;
 modal(title,`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">${insBadge(status)}<span class="muted">Sesi ${sesi} · ${cfg.year} · ${recs.length}/${acts.length} tindakan diisi${insPct(recs)===null?'':' · '+insPct(recs).toFixed(2)+'%'}</span></div>
 ${note?`<div class="note" style="margin-bottom:12px">${icon('info')}<span><b>Nota penyemak:</b> ${esc(note)}</span></div>`:''}
 ${fill&&insNeedsName()?`<label class="field">Nama pengisi *<input id="insFiller" maxlength="100" placeholder="Contoh: Pn. Aini, Ketua Panitia BM" value="${esc(insName())}"></label>`:''}
 ${acts.map(card).join('')}
 <div class="ins-bar ins-sticky">${fill&&sesi>1&&recs.length<acts.length?`<button type="button" id="insCopy">Salin dari sesi ${sesi-1}</button>`:''}${recs.length?`<button type="button" id="insHistory">Sejarah</button>`:''}${fill?`<button type="button" id="insSave">${icon('check')} Simpan draf</button><button type="button" class="primary" id="insSubmit">Hantar untuk pengesahan</button>`:''}</div>
 ${review&&recs.length?`<div class="ins-review"><strong>Semakan</strong><label class="field" style="margin-top:8px">Nota penyemak<textarea id="insReviewNote" rows="2" maxlength="1200" placeholder="Wajib jika memulangkan untuk pembetulan"></textarea></label><div class="ins-bar">${status==='Disahkan'?`<button type="button" id="insReopen">Buka semula</button>`:''}<button type="button" data-ins-review="Perlu pembetulan">Perlu pembetulan</button>${status==='Dihantar'?`<button type="button" class="primary" data-ins-review="Disahkan">${icon('check')} Sahkan</button>`:''}</div></div>`:''}
 <div id="insHistoryBox"></div>`);
 const base={year:cfg.year,sesi,itemId:i.id,unitId};
 const filler=()=>{const el=$('#insFiller');if(!el)return '';const v=el.value.trim();if(!v)throw Error('Taip nama pengisi.');insSaveName(v);return v;};
 const run=async(action,payload,msg)=>{$('#formerror').textContent='';try{db=await api(action,payload);render();toast(msg);insItemForm(itemId,unitId);}catch(e){$('#formerror').textContent=errorText(e);}};
 const critOf=el=>[...el.querySelectorAll('.ins-crit input:not([data-ins-zero]):checked')].map(x=>Number(x.value));
 $$('[data-ins-act]').forEach(el=>{el.querySelectorAll('input,textarea').forEach(c=>c.addEventListener('input',()=>{el.dataset.dirty='1';}));el.querySelectorAll('.ins-crit input').forEach(c=>c.onchange=()=>{el.dataset.dirty='1';const zero=el.querySelector('[data-ins-zero]');if(c===zero&&zero.checked)el.querySelectorAll('.ins-crit input:not([data-ins-zero])').forEach(x=>x.checked=false);else if(c!==zero&&c.checked)zero.checked=false;const crit=critOf(el);el.querySelector('[data-ins-score]').textContent=crit.length||zero.checked?insScore(el.dataset.rule,crit):'–';});});
 // Hanya tindakan yang diubah; tindakan baharu tanpa kriteria perlu tanda "skor 0" secara sedar.
 const collect=()=>$$('[data-ins-act]').filter(el=>el.dataset.dirty).map(el=>{const crit=critOf(el),zero=el.querySelector('[data-ins-zero]').checked;if(!crit.length&&!zero&&Number(el.dataset.version)===0)throw Error('Tindakan '+el.dataset.insAct.split(':')[1]+': tanda kriteria, atau pilih "Tiada kriteria dipenuhi".');return el;}).map(el=>({actionId:el.dataset.insAct,version:Number(el.dataset.version),criteria:critOf(el),evidenceIds:[...el.querySelectorAll('[data-ins-ev]:checked'),...el.querySelectorAll('[data-ins-ev-keep]')].map(x=>x.value),catatan:el.querySelector('[data-ins-note]').value.trim()}));
 if($('#insSave'))$('#insSave').onclick=()=>{try{const scores=collect();if(!scores.length){toast('Tiada perubahan untuk disimpan.');return;}run('saveScores',{...base,filledByName:filler(),scores},'Draf disimpan.');}catch(e){$('#formerror').textContent=errorText(e);}};
 if($('#insSubmit'))$('#insSubmit').onclick=async()=>{let name,scores;try{name=filler();scores=collect();}catch(e){$('#formerror').textContent=errorText(e);return;}
  // Simpan dahulu; jika hantar gagal, borang dibuka semula dengan versi terkini supaya klik seterusnya tidak ditolak.
  try{if(scores.length)db=await api('saveScores',{...base,filledByName:name,scores});}catch(e){$('#formerror').textContent=errorText(e);return;}
  try{db=await api('submitItem',{...base,filledByName:name});render();toast('Item dihantar untuk pengesahan.');insItemForm(itemId,unitId);}catch(e){render();insItemForm(itemId,unitId);$('#formerror').textContent=errorText(e);}};
 if($('#insCopy'))$('#insCopy').onclick=()=>{try{run('copyPrevious',{...base,filledByName:filler()},'Skor sesi sebelum disalin sebagai draf.');}catch(e){$('#formerror').textContent=errorText(e);}};
 $$('[data-ins-review]').forEach(b=>b.onclick=()=>{if(b.dataset.insReview==='Perlu pembetulan'&&!$('#insReviewNote').value.trim()){$('#formerror').textContent='Tulis nota penyemak supaya pengisi tahu apa yang perlu dibetulkan.';return;}run('reviewItem',{...base,decision:b.dataset.insReview,note:$('#insReviewNote').value.trim()},b.dataset.insReview==='Disahkan'?'Item disahkan.':'Item dipulangkan untuk pembetulan.');});
 if($('#insReopen'))$('#insReopen').onclick=()=>{if(confirm('Buka semula item ini? Skor disahkan akan kembali ke Draf dan dikeluarkan daripada rumusan.'))run('reviewItem',{...base,decision:'Buka semula',note:$('#insReviewNote').value.trim()},'Item dibuka semula.');};
 if($('#insHistory'))$('#insHistory').onclick=async()=>{const box=$('#insHistoryBox');box.innerHTML='<p class="muted">Memuatkan sejarah…</p>';try{const out=await Promise.all(acts.map(t=>api('scoreHistory',{scoreId:[cfg.year,sesi,t.id,unitId].join('|')})));const rows=out.flatMap((o,k)=>o.history.map(h=>({...h,act:acts[k].id}))).sort((p,q)=>String(q.at).localeCompare(String(p.at)));box.innerHTML=`<h3 style="margin:16px 0 6px">Sejarah perubahan</h3>`+(rows.map(h=>{const af=h.after?JSON.parse(h.after):{};return `<div class="ins-hist"><b>${esc(h.act.split(':')[1])})</b> ${esc(h.action)} · ${esc(h.name||h.user)} · ${esc(String(h.at).slice(0,16).replace('T',' '))}${af.score!==undefined?' · skor '+esc(af.score):''}</div>`;}).join('')||'<p class="muted">Tiada sejarah.</p>');}catch(e){box.innerHTML=`<p class="error">${esc(errorText(e))}</p>`;}};
}

function insUnitForm(u){
 modal('Ubah unit',`${field('Nama unit *','name',u.name,'required maxlength="120"')}${field('PIC (Ketua Panitia / guru penasihat)','pic',u.pic||'','maxlength="120"')}<label class="check"><input type="checkbox" name="active" ${u.active===true||String(u.active)==='true'?'checked':''}> Aktif (dikira dalam peratus)</label>`,'Simpan',async fd=>{db=await api('saveUnit',{id:u.id,year:u.year,aspectId:u.aspectId,name:fd.get('name').trim(),pic:fd.get('pic').trim(),active:fd.get('active')==='on'});});
}

function bindInstrumen(){
 if(view!=='instrumen'||!db.instrumen)return;
 $$('[data-ins-std]').forEach(b=>b.onclick=()=>{insStd=b.dataset.insStd;render();});
 if($('#insMine'))$('#insMine').onchange=e=>{insMine=e.target.checked;render();};
 if($('#insSesi'))$('#insSesi').onchange=e=>{insSesi=Number(e.target.value);render();};
 $$('[data-ins-item]').forEach(b=>b.onclick=()=>insItemForm(b.dataset.insItem,''));
 $$('[data-ins-matrix]').forEach(b=>b.onclick=()=>insMatrix(b.dataset.insMatrix));
 if($('#insSettings'))$('#insSettings').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);$('#insSettingsError').textContent='';try{db=await api('saveInstrumenSettings',{sesiCount:Number(fd.get('sesiCount')),sesi:Number(fd.get('sesi')),unitOpen:fd.get('unitOpen')==='on'});insSesi=null;render();toast('Tetapan instrumen disimpan.');}catch(err){$('#insSettingsError').textContent=errorText(err);}};
 if($('#insUnitAspect'))$('#insUnitAspect').onchange=e=>{insUnitTab=e.target.value;render();};
 const ua=()=>$('#insUnitAspect').value;
 if($('#insAddUnits'))$('#insAddUnits').onclick=async()=>{$('#insUnitError').textContent='';try{const before=ins().units.length;db=await api('addUnits',{year:insYear(),aspectId:ua(),names:$('#insNewUnits').value});insUnitTab=ua();render();toast((ins().units.length-before)+' unit ditambah.');}catch(err){$('#insUnitError').textContent=errorText(err);}};
 if($('#insCopyUnits'))$('#insCopyUnits').onclick=async()=>{$('#insUnitError').textContent='';try{const before=ins().units.length;db=await api('copyUnits',{fromYear:insYear()-1,year:insYear()});render();toast((ins().units.length-before)+' unit disalin.');}catch(err){$('#insUnitError').textContent=errorText(err);}};
 $$('[data-ins-unit]').forEach(b=>b.onclick=()=>insUnitForm(ins().units.find(u=>u.id===b.dataset.insUnit)));
}
// Index.html mungkin sudah render sebelum skrip ini dimuatkan; render semula supaya menu instrumen muncul.
if(typeof db!=='undefined'&&db&&!db.needsRole&&document.querySelector('.shell'))render();
</script>
