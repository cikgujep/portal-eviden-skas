const DEMO_SS = 'DEMO_SPREADSHEET_ID_0000000000';

let demoBooks = {}, demoFiles = {}, demoUser = DEMO_ADMIN, demoCache = {};

function demoSheet(book, name, data) {
  const s = { name, data: data || [] };
  const width = () => Math.max(0, ...s.data.map(r => r.length));
  Object.assign(s, {
    getName: () => s.name, setName: n => { s.name = n; return s; },
    getLastRow: () => { let n = s.data.length; while (n && (s.data[n - 1] || []).every(v => v === '' || v == null)) n--; return n; },
    getLastColumn: () => width(), setFrozenRows() { return s; },
    appendRow: r => { s.data.splice(s.getLastRow(), 0, r.slice()); return s; },
    deleteRow: i => { s.data.splice(i - 1, 1); return s; },
    getDataRange: () => s.getRange(1, 1, Math.max(1, s.getLastRow()), Math.max(1, width())),
    getRange(r, c, nr = 1, nc = 1) {
      const g = {
        setBackground: () => g, setFontColor: () => g, setFontWeight: () => g,
        getValues: () => Array.from({ length: nr }, (_, i) => Array.from({ length: nc }, (_, j) => { const v = (s.data[r - 1 + i] || [])[c - 1 + j]; return v == null ? '' : v; })),
        setValues(v) { v.forEach((row, i) => { const k = r - 1 + i; while (s.data.length <= k) s.data.push([]); row.forEach((x, j) => { s.data[k][c - 1 + j] = x; }); }); return g; },
        setValue(x) { return g.setValues([[x]]); },
        clearContent() { for (let i = 0; i < nr; i++) { const row = s.data[r - 1 + i]; if (row) for (let j = 0; j < nc; j++) row[c - 1 + j] = ''; } return g; }
      };
      return g;
    }
  });
  return s;
}
function demoBook(id, tabs) {
  const b = { id, sheets: [] };
  Object.assign(b, {
    getId: () => id, getUrl: () => '', getSheets: () => b.sheets.slice(),
    getSheetByName: n => b.sheets.find(s => s.name === n) || null,
    insertSheet: n => { const s = demoSheet(b, n); b.sheets.push(s); return s; },
    deleteSheet: s => { b.sheets = b.sheets.filter(x => x !== s); }
  });
  Object.entries(tabs || { Sheet1: [] }).forEach(([n, d]) => b.sheets.push(demoSheet(b, n, d)));
  return b;
}
const toBytes = b64 => { const bin = atob(b64), out = new Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) > 127 ? bin.charCodeAt(i) - 256 : bin.charCodeAt(i); return out; };
const toB64 = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode((b + 256) % 256); }); return btoa(s); };
function demoFile(id) {
  const f = demoFiles[id]; if (!f) throw new Error('Fail tidak ditemui.');
  return {
    getId: () => id, getName: () => f.name, getUrl: () => 'https://example.com/demo-fail/' + encodeURIComponent(f.name),
    setDescription: () => {}, getBlob: () => ({ getContentType: () => f.mime, getBytes: () => toBytes(f.b64) }),
    getParents: () => { let done = false; return { hasNext: () => !done, next: () => { done = true; return { getId: () => f.folder }; } }; },
    setTrashed: () => { delete demoFiles[id]; }
  };
}
function demoFolder(id) {
  return {
    getId: () => id,
    createFile: blob => { const fid = 'file-' + crypto.randomUUID(); demoFiles[fid] = { name: blob.name, mime: blob.mime, b64: toB64(blob.bytes), folder: id }; return demoFile(fid); }
  };
}

self.UrlFetchApp = { fetch: () => { throw new Error('Tiada rangkaian dalam demo.'); } };
self.Utilities = {
  getUuid: () => crypto.randomUUID(), base64Decode: toBytes, base64Encode: toB64,
  newBlob: (bytes, mime, name) => ({ bytes, mime, name }),
  parseCsv: text => String(text).split(/\r?\n/).filter(l => l.trim()).map(l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; })
};

function demoState() { return { books: Object.fromEntries(Object.entries(demoBooks).map(([id, b]) => [id, Object.fromEntries(b.sheets.map(s => [s.name, s.data]))])), files: demoFiles }; }

self.onmessage = ev => {
  const m = ev.data;
  try {
    if (m.type === 'init') {
      demoBooks = {}; demoFiles = (m.state && m.state.files) || {};
      if (m.state && m.state.books) Object.entries(m.state.books).forEach(([id, tabs]) => { demoBooks[id] = demoBook(id, tabs); });
      demoUser = m.user === 'pps' ? DEMO_PPS : m.user === 'tetamu' ? 'pelawat@contoh.my' : DEMO_ADMIN;
      _tenantId_ = ''; demoCache = {};
      if (!demoBooks[DEMO_SS]) { demoUser = DEMO_ADMIN; demoBootstrap(); demoUser = m.user === 'pps' ? DEMO_PPS : m.user === 'tetamu' ? 'pelawat@contoh.my' : DEMO_ADMIN; }
      self.postMessage({ type: 'ready', state: demoState() });
    } else if (m.type === 'call') {
      _sheetCache_ = {};
      const value = JSON.parse(JSON.stringify(portalApi(m.action, m.payload, DEMO_SS) ?? null));
      self.postMessage({ type: 'result', id: m.id, value, state: demoState() });
    }
  } catch (e) {
    self.postMessage({ type: 'result', id: m.id, error: e && e.message || String(e) });
  }
};

/** Library pusat: setiap sekolah memanggil melalui bridge dalam Google Sheet sendiri (templates/Bridge.gs.txt).
 * Konfigurasi sekolah disimpan dalam tab Tetapan, bukan Script Properties: Script Properties, cache dan kunci skrip Library dikongsi semua sekolah. */
const APP_VERSION_='2.0.0';
/** Kunci Tetapan yang tidak dihantar ke pelayar. */
const PRIVATE_SETTINGS_=['adminEmail','driveFolderId','licenseCode','licenseKey','licenseStatus','licenseExpiry','appVersion'];
let _tenantId_='',_appUrl_='';
/** ID Sheet datang daripada bridge (pelayan), bukan pelayar. Setiap pelaksanaan Apps Script berasingan, jadi global ini tidak bocor antara sekolah. */
function bindTenant_(ssId){
 const id=String(ssId||'').trim();
 if(!/^[A-Za-z0-9_-]{20,}$/.test(id))throw new Error('Portal mesti dibuka melalui skrip bridge dalam Google Sheet sekolah.');
 if(id!==_tenantId_){_tenantId_=id;_ssCache_=null;_sheetCache_={};}
}
function doGet(e,ssId,appUrl){
 bindTenant_(ssId);_appUrl_=String(appUrl||'');
 const c=conf_();
 if(!c.adminEmail)return setupPage_('setup','');
 const lic=licenseStatus_();
 if(!lic.ok)return setupPage_(c.licenseCode?'lock':'activate',lic.message);
 migrate_(c);
 return HtmlService.createTemplateFromFile('Index').evaluate().setTitle('Portal Eviden SK@S').addMetaTag('viewport','width=device-width, initial-scale=1');
}
/** Sertakan fail HTML lain (cth. Instrumen.html) ke dalam Index melalui templat. */
function include(name){return HtmlService.createHtmlOutputFromFile(name).getContent();}
/** Skrin pemasangan, aktivasi lesen atau kunci (Setup.html). */
function setupPage_(mode,message){
 const t=HtmlService.createTemplateFromFile('Setup');
 Object.assign(t,{mode,message:message||'',owner:isOwner_(),needsLicense:!!licenseUrl_(),year:new Date().getFullYear(),appUrl:_appUrl_});
 return t.evaluate().setTitle('Portal Eviden SK@S').addMetaTag('viewport','width=device-width, initial-scale=1');
}
function conf_(){return Object.fromEntries(read_('Tetapan').map(r=>[r.key,r.value]));}
function setConf_(key,value){upsert_('Tetapan',{key,value},'key');}
/** Pemilik deployment web app (admin sekolah yang memasang). Hanya dia boleh memasang atau mengaktifkan lesen. */
function isOwner_(){const a=mail_(Session.getActiveUser().getEmail()),o=mail_(Session.getEffectiveUser().getEmail());return !!a&&a===o;}
/** Kunci per Sheet sekolah; kunci skrip Library dikongsi semua sekolah dan hanya digunakan sebagai sandaran. */
function lock_(){let l=null;try{l=LockService.getDocumentLock();}catch(e){}return l||LockService.getScriptLock();}
function styleHeader_(sheet,name){sheet.setFrozenRows(1);sheet.getRange(1,1,1,TABLES_[name].length).setBackground('#123d36').setFontColor('#ffffff').setFontWeight('bold');}
function schoolType_(v){const t=String(v||'').trim().toUpperCase();if(!['SK','SM',''].includes(t))throw new Error('Jenis sekolah tidak sah.');return t;}
/** Wizard pemasangan: aktifkan lesen, cipta tab, folder Drive, admin dan tetapan awal. adminEmail ditulis terakhir sebagai tanda siap. */
function install_(p){
 if(!isOwner_())throw new Error('Hanya pemilik deployment web app boleh memasang portal.');
 if(conf_().adminEmail)throw new Error('Portal sudah dipasang.');
 const actor=mail_(Session.getActiveUser().getEmail()),lic=activate_(p.licenseCode,p.licenseKey);
 // Berlesen: nama dan kod sekolah ditetapkan oleh baris lesen, bukan oleh pemasang.
 const licensed=!!licenseUrl_();
 if(licensed&&!lic.name)throw new Error('Nama sekolah belum didaftarkan pada lesen ini. Hubungi pembekal.');
 const school=licensed?text_(lic.name,120,true):text_(p.school,120,true),code=licensed?text_(lic.code||p.licenseCode,20,false).toUpperCase():text_(p.code,20,false);
 const year=year_(p.year),type=schoolType_(p.schoolType);
 const book=spreadsheet_();
 Object.keys(TABLES_).forEach(name=>{
  let sheet=book.getSheetByName(name);
  if(!sheet){sheet=book.insertSheet(name);sheet.appendRow(TABLES_[name]);styleHeader_(sheet,name);}
  else if(sheet.getLastRow()===0){sheet.appendRow(TABLES_[name]);styleHeader_(sheet,name);}
  else if(JSON.stringify(sheet.getRange(1,1,1,TABLES_[name].length).getValues()[0])!==JSON.stringify(TABLES_[name]))throw new Error('Struktur tab '+name+' berbeza. Tiada data dipadam.');
 });
 // Buang helaian kosong lalai Sheet baharu (cth. "Sheet1").
 book.getSheets().forEach(s=>{if(!TABLES_[s.getName()]&&s.getLastRow()===0&&book.getSheets().length>1)book.deleteSheet(s);});
 const folder=DriveApp.createFolder('Eviden SK@S - '+school);
 [['school',school],['code',code],['year',year],['schoolType',type],['logoFileId',''],['openAccess',false],['driveFolderId',folder.getId()],['appVersion',APP_VERSION_]].forEach(x=>setConf_(x[0],x[1]));
 if(!read_('Pengguna').some(r=>mail_(r.email)===actor))append_('Pengguna',{id:Utilities.getUuid(),name:text_(p.adminName,100,false)||'Admin Sekolah',email:actor,role:'Admin',active:true});
 if(!read_('Standard_Aspek').length){const rows=[];catalog_().standards.forEach(s=>s.aspects.forEach(a=>a.items.forEach(i=>i.actions.forEach(t=>rows.push({id:t.id,standard:s.id,aspect:a.id,aspectName:a.name,item:i.id,itemName:i.name,action:t.label,pdca:t.pdca})))));appendMany_('Standard_Aspek',rows);}
 if(p.seed===true||p.seed==='true')loadSeed_(year,actor);
 setConf_('adminEmail',actor);
 return {ok:true};
}
/** Muatkan templat cadangan eviden (Seed.js) sebagai Draf. ID berakhiran tahun, jadi muat semula tidak menduplikasi. */
function loadSeed_(year,owner){
 const have=new Set(read_('Eviden').map(r=>r.id)),now=new Date().toISOString(),ev=[],maps=[];
 seedTemplate_().forEach(([id,name,category,unit,management,ms])=>{
  const eid=id+'-'+year;if(have.has(eid))return;
  ev.push({id:eid,name:name.replace(/\{Y\}/g,year),year,date:'',category,unit,source:'Pautan dokumen',appId:'',url:'',fileId:'',fileName:'',management,status:'Draf',owner,review:'Cadangan templat: gantikan dengan dokumen sebenar sekolah.',updated:now,version:1,catatan:''});
  ms.forEach(([aspectId,actionIds,pdca,note],i)=>maps.push({id:'map-'+eid+'-'+i,evidenceId:eid,aspectId,actionIds,pdca,reference:'',note}));
 });
 appendMany_('Eviden',ev);appendMany_('Pemetaan_Eviden',maps);
 return ev.length;
}
/** Kemas kini skema bila versi Library berubah. read_ sudah menambah lajur baharu; di sini untuk perubahan data. */
function migrate_(c){if(c.appVersion!==APP_VERSION_)setConf_('appVersion',APP_VERSION_);}
let _ssCache_=null,_sheetCache_={};

 const lock=lock_();lock.waitLock(30000);
 try{
  let result;

  else if(action==='loadSample'){requireAdmin_(u);loadSample_(year_(p.year),u.email);}
  else if(action==='clearSample'){requireAdmin_(u);clearSample_();}
  else if(action==='upload'){requireEditor_(u);result=upload_(p,u,false);}

  else if(action==='savePps'){requireAdmin_(u);savePps_(p);}
  else if(action==='saveComponent'){requireAdmin_(u);saveComponent_(p);}
  else if(action==='saveApp'){requireAdmin_(u);saveApp_(p);}
  else if(action==='deleteApp'){requireAdmin_(u);deleteApp_(p);}
  else if(action==='importRumusanSkor'){requireAdmin_(u);importRumusanSkor_(p);}
  else if((result=instrumenApi_(action,p,u))!==undefined){if(result===true)result=undefined;}

  append_('Log_Aktiviti',{id:Utilities.getUuid(),at:new Date().toISOString(),user:u.email,action,recordId:p.id||p.itemId||''});
  return result||state_(u);
 }finally{lock.releaseLock();}
}

}

function saveScores_(p,u){

  const a=idx[s.actionId];if(!a||a.item.id!==item.id)throw new Error('Tindakan '+s.actionId+' bukan dalam item '+item.id+'.');

  if(old&&old.status==='Disahkan')throw new Error('Tindakan '+a.action.id+' sudah disahkan. Minta penyelaras membuka semula.');
  if(old&&Number(old.version)!==Number(s.version))throw new Error('Skor '+a.action.id+' telah diubah oleh orang lain. Muat semula sebelum menyimpan.');

  const criteria=ids_((s.criteria||[]).map(Number),a.criteria.map((_,k)=>k+1)).sort();
  const ev=ids_((s.evidenceIds||[]).map(String),[...evidence]);if(ev.length>20)throw new Error('Maksimum 20 eviden bagi setiap tindakan.');
  const rec={id,year,sesi,actionId:a.action.id,itemId:item.id,aspectId:aspect.id,unitId,criteria,score:scoreFor_(a.rule,criteria),evidenceIds:ev,catatan:text_(s.catatan,1200,false),status:'Draf',filledBy:u.email||'',filledByName:name,reviewedBy:'',reviewNote:'',updated:new Date().toISOString(),version:old?Number(old.version)+1:1};

 if(missing.length)throw new Error('Isi semua tindakan dahulu. Belum diisi: '+missing.join(', ')+'.');

/** Keputusan penyemak: Disahkan, Perlu pembetulan, atau Buka semula (Disahkan → Draf). */
function reviewItem_(p,u){

 if(!from)throw new Error('Keputusan semakan tidak sah.');

/** Peratus keseluruhan = Σ skor ÷ (4 × tindakan diisi) × 100, di setiap peringkat. Aspek berunit dikira merentas unit aktif. */
function instrumenSummary_(year,sesi,confirmedOnly){
 const idx=actionIndex_(),units=read_('Unit_Instrumen').filter(x=>Number(x.year)===Number(year)&&truthy_(x.active));
 const recs=read_('Skor_Tindakan').filter(r=>Number(r.year)===Number(year)&&Number(r.sesi)===Number(sesi)&&(!confirmedOnly||r.status==='Disahkan')&&idx[r.actionId]&&(!r.unitId||units.some(x=>x.id===r.unitId)));
 const out={item:{},aspect:{},standard:{},overall:null},bump=(bag,id,score,filled,total)=>{const b=bag[id]||(bag[id]={sum:0,filled:0,total:0});b.sum+=score;b.filled+=filled;b.total+=total;};
 Object.values(idx).forEach(a=>{const n=UNIT_ASPECTS_[a.aspect.id]?units.filter(x=>x.aspectId===a.aspect.id).length:1;[[out.item,a.item.id],[out.aspect,a.aspect.id],[out.standard,a.standard.id]].forEach(([bag,id])=>bump(bag,id,0,0,n));});
 recs.forEach(r=>{const a=idx[r.actionId];[[out.item,a.item.id],[out.aspect,a.aspect.id],[out.standard,a.standard.id]].forEach(([bag,id])=>bump(bag,id,Number(r.score)||0,1,0));});
 const pct=b=>{b.pct=b.filled?Math.round(b.sum/(4*b.filled)*10000)/100:null;return b;};
 ['item','aspect','standard'].forEach(k=>Object.values(out[k]).forEach(pct));
 out.overall=pct(Object.values(out.standard).reduce((t,b)=>({sum:t.sum+b.sum,filled:t.filled+b.filled,total:t.total+b.total}),{sum:0,filled:0,total:0}));

}
/** Rumusan_Skor menjadi cermin skor Disahkan sesi semasa; baris CSV lain tidak disentuh. */

 [['item',sum.item],['standard',sum.standard]].forEach(([level,bag])=>Object.entries(bag).forEach(([id,b])=>{if(b.pct!==null)upsert_('Rumusan_Skor',{id,level,score:b.pct});else if(touched.includes(id))stale.push(level+'|'+id);}));

 if(stale.length){const rows=read_('Rumusan_Skor'),keep=rows.filter(r=>!stale.includes(r.level+'|'+r.id));if(keep.length!==rows.length)writeAll_('Rumusan_Skor',keep);}

/** Lesen pusat. LESEN_URL (Script Properties Library) ialah web app pelayan lesen milik pembangun (templates/PelayanLesen.gs.txt).
 * Library tidak membuka Master DB terus: web app sekolah berjalan sebagai admin sekolah, jadi openById akan memerlukan mereka
 * diberi akses ke Master DB (dan nampak kod lesen semua sekolah). Tanpa LESEN_URL, Library berjalan tanpa semakan lesen (mod pembangun). */
function licenseUrl_(){return PropertiesService.getScriptProperties().getProperty('LESEN_URL')||'';}
function licenseCacheKey_(){return 'T_'+_tenantId_+'_lesen';}
function callLicense_(op,code,key){
 const res=UrlFetchApp.fetch(licenseUrl_(),{method:'post',contentType:'application/json',payload:JSON.stringify({op,code,key,ss:_tenantId_}),muteHttpExceptions:true,followRedirects:true});
 if(res.getResponseCode()!==200)throw new Error('Pelayan lesen tidak dapat dihubungi ('+res.getResponseCode()+').');
 return JSON.parse(res.getContentText());
}
/** Aktifkan lesen untuk Sheet ini. Satu lesen sekolah boleh digunakan pada beberapa Sheet; nama dan kod sekolah diambil dari lesen. */
function activate_(code,key){
 if(!licenseUrl_())return {name:''};
 code=text_(code,40,true).toUpperCase();key=text_(key,80,true);
 const r=callLicense_('activate',code,key);
 if(!r.ok)throw new Error(r.message||'Kod lesen tidak sah.');
 [['licenseCode',code],['licenseKey',key],['licenseStatus','AKTIF'],['licenseExpiry',r.expiry||'']].forEach(x=>setConf_(x[0],x[1]));
 syncSchool_(r);
 CacheService.getScriptCache().remove(licenseCacheKey_());
 return r;
}
/** Status lesen sekolah ini, dicache 30 minit. Cache Library dikongsi semua sekolah, jadi kunci wajib berprefiks ID Sheet. */
function licenseStatus_(){
 if(!licenseUrl_())return {ok:true};
 const cache=CacheService.getScriptCache(),k=licenseCacheKey_(),hit=cache.get(k);if(hit)return JSON.parse(hit);
 const c=conf_();let r,ttl=1800;
 if(!c.licenseCode)r={ok:false,message:'Portal belum diaktifkan dengan kod lesen.'};
 else try{
  const s=callLicense_('check',c.licenseCode,c.licenseKey),status=s.ok?'AKTIF':String(s.status||'DISEKAT');
  r={ok:!!s.ok,message:s.message||''};
  if(c.licenseStatus!==status)setConf_('licenseStatus',status);
  if(String(c.licenseExpiry||'')!==String(s.expiry||''))setConf_('licenseExpiry',s.expiry||'');
  if(s.ok)syncSchool_(s,c);
 }catch(e){
  // Pelayan lesen tidak dapat dihubungi: guna status terakhir supaya gangguan rangkaian tidak menyekat sekolah.
  const exp=c.licenseExpiry?new Date(c.licenseExpiry):null;
  r={ok:c.licenseStatus==='AKTIF'&&!(exp&&!isNaN(exp)&&exp<new Date()),message:'Status lesen tidak dapat disahkan: '+e.message};ttl=300;
 }
 cache.put(k,JSON.stringify(r),ttl);
 return r;
}
/** Nama dan kod sekolah mengikut baris lesen di Master DB. Perubahan ejaan di Master sampai ke portal dalam masa 30 minit. */
function syncSchool_(r,c){
 c=c||conf_();
 const name=String(r.name||'').trim().slice(0,120),code=String(r.code||'').trim().toUpperCase().slice(0,20);
 if(name&&c.school!==name)setConf_('school',name);
 if(code&&c.code!==code)setConf_('code',code);
}

/** Skor 0–4 daripada kriteria dipenuhi (senarai nombor 1-based, cth. [1,3]). */
function scoreFor_(rule,criteria){
 const n={A3:3,B3:3,A4:4,B4:4,C4:4}[rule];if(!n)throw new Error('Peraturan skor tidak dikenali: '+rule);
 const set=[...new Set((criteria||[]).map(Number))];if(set.some(x=>!Number.isInteger(x)||x<1||x>n))throw new Error('Kriteria tidak sah.');
 const c=set.length,first=set.includes(1);
 if(c===n)return 4;if(!c)return 0;
 if(rule==='C4')return c;
 if(rule==='B4')return first?c:0; // tanpa (i) = 0 (keputusan 10 Okt 2026)
 if(rule==='B3')return c===2?(first?3:2):1;
 if(rule==='A3')return first?(c===2?3:2):1;
 return first?Math.max(c,2):1; // A4: (i) sahaja = 2, selaras dengan A3 (keputusan 10 Okt 2026)
}

ah cadangan eviden generik (Draf) untuk tahun ${year}. Cadangan yang sudah wujud tidak diduplikasi.</p><button type="button" id="loadSeed">${icon('plus')} Muatkan templat ${year}</button></div></section>`:''}${live?`<section class="panel"><div class="panelhead"><h2>Data contoh</h2>${db.hasSample?'<span class="badge amber">Sedang digunakan</span>':''}</div><div class="formbody"><p class="muted">${db.hasSample?'Portal sedang memaparkan data contoh untuk tahun '+(db.sampleYear||year)+'. Buang data contoh sebelum mula mengisi data sebenar. Rekod sebenar yang anda tambah tidak akan dipadam.':'Jana data rekaan untuk melihat aliran penuh portal: eviden berpautan, Pasukan PPS, Direktori Sekolah, Kekuatan Kami, Pencapaian Kami dan skor Instrumen. Anda boleh membuangnya semula dengan satu klik.'}</p>${db.hasSample?`<button type="button" id="clearSample">${icon('trash')} Buang data contoh</button>`:`<button type="button" class="primary" id="loadSample">${icon('plus')} Jana data contoh ${year}</button>`}</div></section>`:''}</div><div><section class="panel"><div class="panelhead"><h2>Penyimpanan data</h2></div><div class="formbody"><h3>${live?'Google Sheets aktif':'Mod percubaan tempatan'}</h3><p class="muted">${live?'Rekod disimpan dalam Google Sheets sekolah. Muat naik disimpan dalam folder Google Drive yang ditetapkan.':'Perubahan dalam pratonton ini disimpan pada pelayar ini sahaja. Google Sheets sebenar belum disambungkan. Gunakan rekod ujian dahulu.'}</p>${live&&db.sheetUrl?link(db.sheetUrl,'Buka Google Sheet'):''}<p class="smallhint">Nama dan logo sekolah digunakan pada portal dan laporan. Akses tetapan dikhaskan kepada admin.</p></div></section><div class="note">${icon('info')}<span>Tetapan tahun aktif tidak memadam rekod tahun sebelumnya. Tukar tahun pada bar atas untuk melihat arkib.</span></div></div></div>`;}
function basis(){return head('Aplikasi sekolah','Direktori Sekolah','Daftar aplikasi sekali, pautkan rekodnya kepada eviden.',admin()?`<button class="primary" id="addApp">${icon('plus')} Daftar aplikasi</button>`:'')+`<div class="grid2">${db.apps.map(a=>`<section class="panel apptile"><div class="appicon">${icon('grid')}</div><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p><div class="actions">${link(a.url,'Buka aplikasi',true)}${admin()?`<button class="iconbtn" data-app="${a.id}" title="Ubah aplikasi" aria-label="Ubah aplikasi">${icon('edit')}</button><button class="iconbtn" data-delete-app="${a.id}" title="Padam aplikasi" aria-label="Padam aplikasi">${icon('trash')}</button>`:''}</div></section>`).join('')||'<div class="panel empty wide">Direktori masih kosong.<br>Daftarkan aplikasi dan sistem yang sekolah sudah gunakan.</div>'}</div>`;}
function strength(){const names=['Guru','Kualiti Pengajaran dan Pembelajaran (PdP)','Staf Bukan Guru','Prasarana Akademik','Prasarana Sukan dan Kokurikulum','Prasarana Hal Ehwal Murid','Persekitaran Digital','Asrama','Sokongan Ibu Bapa/Penjaga, Komuniti dan Pihak Swasta'];return head('Komponen 01','Kekuatan Kami','Struktur profil sumber dan kekuatan sekolah.')+`<div class="note" style="margin:0 0 20px">${icon('info')}<span>Pengisian komponen ini dijadualkan pada fasa seterusnya. Versi pertama memfokuskan eviden Pengurusan Kami.</span></div><div class="grid2">${names.map((n,i)=>`<section class="panel introcard"><span class="badge green">A${i+1}</span><h3 style="margin-top:12px">${n}</h3><span class="smallhint">Belum dibuka untuk pengisian</span></section>`).join('')}</div>`;}
function outcomes(){return head('Komponen 03','Pencapaian Kami','Kemenjadian murid, pencapaian guru dan sekolah.')+`<div class="note" style="margin:0 0 20px">${icon('info')}<span>Pengisian komponen ini dijadualkan pada fasa seterusnya.</span></div><div class="grid2">${['Kemenjadian Murid dalam Akademik','Kemenjadian Murid dalam Kokurikulum','Kemenjadian Sahsiah Murid','Pencapaian Guru dan Sekolah'].map((n,i)=>`<section class="panel introcard"><span class="badge green">5.${i+1}</span><h3 style="margin-top:12px">${n}</h3><span class="smallhint">Belum dibuka untuk pengisian</span></section>`).join('')}</div>`;}
function bind(){
 $$('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;query='';render();});
 $('#menu').onclick=()=>$('.sidebar').classList.toggle('open');
 $('#year').onchange=e=>{year=Number(e.target.value);render();};
 $$('[data-standard]').forEach(b=>b.onclick=()=>{if(b.dataset.standard==='4'){toast('Standard 4: aliran pencerapan akan dibangunkan pada fasa seterusnya.');return;}selected=b.dataset.standard;opened='';query='';filter='all';render();});
 $$('[data-aspect]').forEach(b=>{b.onclick=()=>{opened=opened===b.dataset.aspect?'':b.dataset.aspect;render();};b.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();b.click();}};});
 if($('#search'))$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);};
 if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;render();};
 if($('#reportStd'))$('#reportStd').onchange=e=>{reportStd=e.target.value;reportAspect='all';render();};
 if($('#reportAspect'))$('#reportAspect').onchange=e=>{reportAspect=e.target.value;render();};
 if($('#addEvidence'))$('#addEvidence').onclick=()=>evidenceForm();
 if($('#addFile'))$('#addFile').onclick=()=>evidenceForm(null,'',true);
 $$('[data-item-aspect]').forEach(b=>b.onclick=()=>evidenceForm(null,b.dataset.itemAspect,false,b.dataset.itemActions?b.dataset.itemActions.split(','):[]));
 $$('[data-add-aspect]').forEach(b=>b.onclick=()=>chooseEvidence(b.dataset.addAspect));
 $$('[data-edit]').forEach(b=>b.onclick=()=>evidenceForm(db.evidence.find(e=>e.id===b.dataset.edit)));
 $$('[data-detail]').forEach(b=>b.onclick=()=>detailForm(db.evidence.find(e=>e.id===b.dataset.detail)));
 $$('[data-download]').forEach(b=>b.onclick=()=>{const a=document.createElement('a');a.href=b.dataset.download;a.download='eviden';a.click();});
 if($('#settingsform'))bindSettings();
 if($('#addPps'))$('#addPps').onclick=()=>ppsForm();
 $$('[data-pps]').forEach(b=>b.onclick=()=>ppsForm(db.pps.find(p=>p.id===b.dataset.pps)));
 if($('#addApp'))$('#addApp').onclick=()=>appForm();
 $$('[data-app]').forEach(b=>b.onclick=()=>appForm(db.apps.find(a=>a.id===b.dataset.app)));
 $$('[data-delete-app]').forEach(b=>b.onclick=async()=>{const a=db.apps.find(x=>x.id===b.dataset.deleteApp);if(!a||!confirm('Padam aplikasi "'+a.name+'"? Tindakan ini tidak boleh diundur.'))return;try{db=await api('deleteApp',{id:a.id});render();toast('Aplikasi dipadam.');}catch(err){toast(errorText(err));}});
 if($('#export'))$('#export').onclick=exportCsv;
 if($('#print'))$('#print').onclick=()=>window.print();
 if(typeof bindInstrumen==='function')bindInstrumen();
}
function modal(title,body,submitText='Simpan',handler){$('#modal').innerHTML=`<form id="modalform"><div class="modalhead"><h2>${title}</h2><button type="button" class="plain" id="closemodal" aria-label="Tutup">${icon('close')}</button></div><div class="modalbody">${body}<div class="error formerror" id="formerror" role="alert"></div></div><div class="modalfoot"><button type="button" id="cancelmodal">Batal</button>${handler?`<button class="primary" type="submit">${submitText}</button>`:''}</div></form>`;$('#closemodal').onclick=$('#cancelmodal').onclick=()=>$('#modal').close();$('#modalform').onsubmit=async ev=>{ev.preventDefault();const btn=$('#modalform button[type=submit]');btn.disabled=true;$('#formerror').textContent='';try{await handler(new FormData(ev.target));$('#modal').close();render();toast('Rekod berjaya disimpan.');}catch(e){$('#formerror').textContent=errorText(e);}finally{btn.disabled=false;}};if(!$('#modal').open)$('#modal').showModal();}
function field(label,name,value='',attrs=''){return `<label class="field">${label}<input name="${name}" value="${esc(value)}" ${attrs}></label>`;}
function datalist(id,values){return `<datalist id="${id}">${(values||[]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;}
const lines=t=>String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
function optionList(values,selected){return values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function chooseEvidence(aspect){const es=records().filter(e=>canEdit(e));modal('Eviden untuk aspek '+aspect,`<p class="muted">Daftarkan bukti baharu atau tambah pemetaan pada dokumen yang sudah tersedia.</p><button type="button" class="primary" id="newForAspect">${icon('plus')} Daftar eviden baharu</button>${es.length?`<label class="field" style="margin-top:22px">Guna eviden sedia ada<select id="reuse"><option value="">Pilih dokumen…</option>${es.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label>`:''}`);$('#newForAspect').onclick=()=>evidenceForm(null,aspect);if($('#reuse'))$('#reuse').onchange=e=>{if(e.target.value)evidenceForm(db.evidence.find(x=>x.id===e.target.value),aspect);};}
function evidenceForm(existing,initialAspect='',management=false,initialActionIds=[]){let e=existing||{name:'',date:'',category:'Laporan',source:'Pautan dokumen',status:'Draf',unit:'',url:'',management,year};let ms=existing?structuredClone(mappingsFor(e.id)):[];if(initialAspect&&!ms.some(m=>m.aspectId===initialAspect))ms.push({aspectId:initialAspect,actionIds:[...initialActionIds],pdca:[],reference:'',note:''});if(!ms.length&&!management&&!e.management)ms.push({aspectId:CATALOG.standards.find(s=>s.id===selected).aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});
 modal(existing?'Ubah eviden':'Tambah eviden',`${field('Nama dokumen sebenar *','name',e.name,'required maxlength="200" placeholder="Contoh: Minit Mesyuarat Kurikulum Bil. 1/2025"')}<div class="grid2"><label class="field">Kategori<select name="category">${optionList(['Laporan','Minit mesyuarat','Maklum balas','Memo','Surat','Pelan / ketetapan','Analisis','Rekod pemantauan','Lain-lain'],e.category)}</select></label></div>${field('Panitia / unit / kelab','unit',e.unit,'maxlength="120" list="unitlist" placeholder="Contoh: Panitia Bahasa Melayu"')}${datalist('unitlist',db.settings.units)}<div class="grid2"><label class="field">Sumber eviden<select id="source" name="source">${['Pautan dokumen','Aplikasi BASIS','Muat naik fail','Fail Keras'].map(v=>`<option value="${v}" ${v===e.source?'selected':''}>${sourceLabel(v)}</option>`).join('')}</select></label><label class="field" id="appfield">Aplikasi sekolah<select name="appId"><option value="">Pilih aplikasi…</option>${db.apps.map(a=>`<option value="${a.id}" ${e.appId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div><label class="field" id="urlfield">Pautan dokumen / rekod khusus<input name="url" type="url" placeholder="Tampal pautan di sini" value="${esc(safeURL(e.url))}"><small>Gunakan pautan rekod atau laporan yang boleh dibuka oleh penyemak.</small></label><label class="field">Catatan<textarea name="catatan" maxlength="1200" placeholder="Nota tambahan (pilihan)">${esc(e.catatan||'')}</textarea><small>Pilihan — nota ringkas untuk rujukan dalaman.</small></label><label class="field uploadbox" id="filefield">Muat naik fail<input type="file" id="evidencefile" accept=".pdf,.png,.jpg,.jpeg,.webp"><small>PDF / PNG / JPG / WebP · Maksimum ${live?'5':'1'} MB${e.fileName?' · Sedia ada: '+esc(e.fileName):''}</small></label><label class="check"><input type="checkbox" name="management" ${e.management?'checked':''}> Paparkan dalam Fail Pengurusan SK@S</label><div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px"><h3>Pemetaan aspek & PDCA</h3><button type="button" id="addmapping">${icon('plus')} Aspek</button></div><p class="smallhint">Pilih tindakan yang dibuktikan. Cadangan PDCA boleh diubah; ia bukan skor rasmi.</p><div id="mappings"></div>`, 'Simpan eviden', async fd=>{
  collectMappings();let url=fd.get('url').trim(),fileName=e.fileName||'',fileId=e.fileId||'';const src=fd.get('source'),isFile=fd.get('management')==='on';
  if(!ms.length&&!isFile)throw Error('Pilih sekurang-kurangnya satu aspek.');
  if(ms.some(m=>!m.actionIds.length||!m.pdca.length))throw Error('Setiap pemetaan memerlukan tindakan, tag PDCA .');
  if(src==='Aplikasi BASIS'&&!fd.get('appId'))throw Error('Pilih aplikasi sekolah.');
  if(src==='Muat naik fail'){const file=$('#evidencefile').files[0];if(file){const result=await upload(file,live?5:1);url=result.url;fileId=result.fileId;fileName=result.name;}else if(e.source==='Muat naik fail'&&e.url)url=e.url;else throw Error('Pilih fail untuk dimuat naik.');}else if(url&&!safeURL(url))throw Error('Masukkan pautan HTTPS yang sah.');
  db=await api('saveEvidence',{id:e.id||'',version:e.version||0,name:fd.get('name').trim(),date:'',category:fd.get('category'),unit:fd.get('unit').trim(),source:src,appId:src==='Aplikasi BASIS'?fd.get('appId'):'',url,fileId,fileName,catatan:fd.get('catatan').trim(),management:isFile,status:'Draf',year:e.year||year,mappings:ms});
 });
 function collectMappings(){ms=$$('.mapping').map(el=>({aspectId:el.querySelector('.mapaspect').value,actionIds:[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value),pdca:[...el.querySelectorAll('.pdcacheck:checked')].map(x=>x.value),reference:'',note:''}));}
 function drawMappings(){$('#mappings').innerHTML=ms.map((m,idx)=>{const a=aspects.find(a=>a.id===m.aspectId)||aspects[0];return `<div class="mapping"><div class="maphead"><span>Pemetaan ${idx+1}</span><button type="button" class="plain removemap" data-index="${idx}">Buang</button></div><label class="field">Aspek<select class="mapaspect">${aspects.map(a=>`<option value="${a.id}" ${a.id===m.aspectId?'selected':''}>${a.id} · ${esc(a.name)}</option>`).join('')}</select></label><div class="field"><span>Tindakan yang disokong *</span><div class="actionlist">${a.items.map(i=>`<p class="smallhint"><b>${i.id}</b> ${esc(i.name)}</p>${i.actions.map(t=>`<label class="check" style="margin:7px 0"><input class="actioncheck" type="checkbox" value="${t.id}" ${m.actionIds.includes(t.id)?'checked':''}>${esc(t.label)}</label>`).join('')}`).join('')}</div></div><div class="checks">${Object.keys(pdcaNames).map(p=>`<label class="check"><input class="pdcacheck" type="checkbox" value="${p}" ${m.pdca.includes(p)?'checked':''}>${p} · ${pdcaNames[p]}</label>`).join('')}</div></div>`;}).join('');$$('.mapaspect').forEach((s,i)=>s.onchange=()=>{collectMappings();ms[i].actionIds=[];ms[i].pdca=[];drawMappings();});$$('.actioncheck').forEach(c=>c.onchange=()=>{const el=c.closest('.mapping');const ids=[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value);const tags=allActions.filter(a=>ids.includes(a.id)).map(a=>a.pdca);el.querySelectorAll('.pdcacheck').forEach(x=>x.checked=tags.includes(x.value));});$$('.removemap').forEach(b=>b.onclick=()=>{collectMappings();ms.splice(Number(b.dataset.index),1);drawMappings();});}
 $('#addmapping').onclick=()=>{collectMappings();ms.push({aspectId:aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});drawMappings();};drawMappings();
 const setSource=()=>{const s=$('#source').value;$('#appfield').style.display=s==='Aplikasi BASIS'?'grid':'none';$('#filefield').style.display=s==='Muat naik fail'?'grid':'none';$('#urlfield').style.display=(s==='Muat naik fail'||s==='Fail Keras')?'none':'grid';$('#urlfield input').required=false;};$('#source').onchange=setSource;setSource();
}
function detailForm(e){const rows=mappingsFor(e.id).map(m=>{const a=aspects.find(x=>x.id===m.aspectId);const acts=allActions.filter(x=>m.actionIds.includes(x.id));return `<div class="mapping" style="margin-top:15px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><strong>Aspek ${m.aspectId}${a?' · '+esc(a.name):''}</strong>${sourceLinkBtn(e)}</div>${acts.length?`<ul style="margin:8px 0 0;padding-left:18px">${acts.map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul>`:''}${m.pdca.length?`<div class="pdca" style="margin-top:8px">${m.pdca.map(p=>`<span class="${p}">${p} · ${pdcaNames[p]}</span>`).join('')}</div>`:''}</div>`;}).join('');modal('Butiran eviden',`<h3>${esc(e.name)}</h3><p class="muted">${esc(e.category)}${e.unit?' · '+esc(e.unit):''}</p><h4 style="margin:18px 0 0">Pemetaan aspek &amp; PDCA</h4>${rows||'<p class="smallhint">Tiada pemetaan aspek.</p>'}${e.catatan?`<div class="note" style="margin-top:15px">${icon('info')}<span>${esc(e.catatan)}</span></div>`:''}`);}
function ppsForm(p={}){modal(p.id?'Ubah PPS':'Daftar PPS',`${field('Nama *','name',p.name,'required maxlength="100"')}${field('E-mel Google (untuk akses PPS)','email',p.email,'type="email" maxlength="150"')}${field('Jawatan *','position',p.position,'required maxlength="100" list="positionlist" placeholder="Contoh: Setiausaha Kurikulum"')}${datalist('positionlist',db.settings.positions)}<p class="smallhint">Tahun ${year} · Pilih semua aspek tanggungjawab.</p>${aspects.map(a=>`<label class="check" style="margin:9px 0"><input name="aspects" type="checkbox" value="${a.id}" ${p.aspects?.includes(a.id)?'checked':''}>${a.id} · ${esc(a.name)}</label>`).join('')}`,'Simpan PPS',async fd=>{if(!fd.getAll('aspects').length)throw Error('Pilih sekurang-kurangnya satu aspek.');db=await api('savePps',{id:p.id||'',name:fd.get('name').trim(),email:fd.get('email').trim().toLowerCase(),position:fd.get('position').trim(),year,aspects:fd.getAll('aspects')});});}
function appForm(a={}){modal(a.id?'Ubah aplikasi':'Daftar aplikasi sekolah',`${field('Nama aplikasi *','name',a.name,'required maxlength="120"')}${field('Pautan aplikasi *','url',a.url,'type="url" required placeholder="Tampal pautan di sini"')}<label class="field">Fungsi aplikasi *<textarea name="description" required maxlength="800">${esc(a.description||'')}</textarea></label>`,'Simpan aplikasi',async fd=>{if(!safeURL(fd.get('url')))throw Error('Gunakan pautan HTTPS yang sah.');db=await api('saveApp',{id:a.id||'',name:fd.get('name').trim(),url:fd.get('url'),description:fd.get('description').trim(),owner:a.owner||''});});}
async function readFile(file,limit,imagesOnly=false){const types=imagesOnly?['image/png','image/jpeg','image/webp']:['image/png','image/jpeg','image/webp','application/pdf'];if(!types.includes(file.type))throw Error('Format fail tidak disokong.');if(file.size>limit*1024*1024)throw Error(`Saiz fail melebihi ${limit} MB.`);return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Fail tidak dapat dibaca.'));r.readAsDataURL(file);});}
async function upload(file,limit){const dataUrl=await readFile(file,limit);return api('upload',{name:file.name,mime:file.type,dataUrl});}

');}catch(e){$('#settingserror').textContent=errorText(e);}finally{btn.disabled=false;}};if($('#openAccessToggle'))$('#openAccessToggle').onchange=async e=>{const checked=e.target.checked;e.target.disabled=true;try{db=await api('settings',{school:db.settings.school,code:db.settings.code,year:db.settings.year,logo:db.settings.logo,openAccess:checked});render();toast(checked?'Akses terbuka diaktifkan.':'Akses terbuka dimatikan.');}catch(err){e.target.checked=!checked;e.target.disabled=false;toast(errorText(err));}};
 if($('#rumusanFile'))$('#rumusanFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#rumusanError').textContent='';try{const csv=await f.text();db=await api('importRumusanSkor',{csv});toast(`${(db.rumusanSkor||[]).length} rekod skor diimport.`);render();}catch(err){$('#rumusanError').textContent=errorText(err);e.target.value='';}};
}

// Additional portal components use the same authenticated Sheets API.
const componentNames={strength:['Guru','Kualiti Pengajaran dan Pembelajaran (PdP)','Staf Bukan Guru','Prasarana Akademik','Prasarana Sukan dan Kokurikulum','Prasarana Hal Ehwal Murid','Persekitaran Digital','Asrama','Sokongan Ibu Bapa/Penjaga, Komuniti dan Pihak Swasta']};
const outcomeCats=[['Kemenjadian Murid dalam Akademik',50],['Kemenjadian Murid dalam Kokurikulum',15],['Kemenjadian Sahsiah Murid',15],['Pencapaian Guru',10],['Pencapaian Sekolah',10]];
function outcomeValue(i){const r=(db.components||[]).find(r=>r.key==='outcomes-'+i&&Number(r.year)===year);return r?Number(r.value)||0:0;}
function scoreCard(label,val,max,badge){const pct=max?Math.round(val/max*1000)/10:0;return `<section class="panel scorecard"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span class="badge green">${badge}</span><div style="font-size:20px;font-weight:750;color:var(--green)">${pct}%</div></div><h3 style="margin-top:12px">${esc(label)}</h3><div class="scoreval">${val.toFixed(2)}<small>/${max}</small></div></section>`;}
function outcomeCard(i,vals,tone){const c=outcomeCats[i];const r=(db.components||[]).find(r=>r.key==='outcomes-'+i&&Number(r.year)===year);const pct=Math.round(vals[i]/c[1]*1000)/10;const clr=tone==='amber'?'#a9791f':'var(--green)';return `<section class="panel apptile${tone==='amber'?' amber':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span class="badge ${tone}">K${i+1}</span><div style="font-size:24px;font-weight:750;color:${clr}">${pct}%</div></div><h2 style="margin-top:12px">${esc(c[0])}</h2><div class="scoreval">${vals[i].toFixed(2)}<small>/${c[1]}</small></div><div class="actions">${r?.url?link(r.url,'Buka pautan',true):''}${admin()?`<button class="iconbtn" onclick="outcomeForm(${i})" title="Kemas kini skor" aria-label="Kemas kini skor">${icon('edit')}</button>`:''}</div></section>`;}

 return head('Komponen 03','Pencapaian Kami','Skor pencapaian '+db.settings.school+' mengikut tahun · '+year)+`<div class="scoretop"><div class="scorebig"><div class="scorebignum">${totalVal.toFixed(2)}</div><div class="scorebiglabel">Skor keseluruhan daripada ${totalMax}</div></div><div class="scoregroup2">${scoreCard('Kemenjadian Murid',muridVal,muridMax,'A')}${scoreCard('Pencapaian Guru dan Sekolah',guruVal,guruMax,'B')}</div></div><h3 style="margin:0 0 12px">Kemenjadian Murid</h3><div class="scoregroup3">${[0,1,2].map(i=>outcomeCard(i,vals,'green')).join('')}</div><h3 style="margin:22px 0 12px">Pencapaian Guru dan Sekolah</h3><div class="scoregroup2">${[3,4].map(i=>outcomeCard(i,vals,'amber')).join('')}</div>`;

function outcomeForm(i){const r=(db.components||[]).find(r=>r.key==='outcomes-'+i&&Number(r.year)===year)||{};modal(outcomeCats[i][0],`${field('Skor asal (daripada '+outcomeCats[i][1]+')','value',r.value||'0','type="number" step="0.01" min="0" max="'+outcomeCats[i][1]+'" required')}${field('Pautan dokumen sokongan (pilihan)','url',r.url||'','type="url"')}`,'Simpan skor',async fd=>{db=await api('saveComponent',{key:'outcomes-'+i,year,summary:'',value:fd.get('value'),unit:'',url:fd.get('url')});});}
function itemEvidence(a){return a.items.map(i=>{const es=evidenceFor(a.id).filter(e=>mappingsFor(e.id).some(m=>m.aspectId===a.id&&m.actionIds.some(id=>id.startsWith(i.id+':'))));const ps=db.pps.filter(p=>Number(p.year)===year&&(p.items||[]).includes(i.id));const r=rumusanFor(i.id,'item');return `<section class="itemgroup"><div class="itemheading"><div><span class="aspectcode">${i.id}</span><h3>${esc(i.name)}${r?scoreBadge(r.score):''}</h3><small>${ps.map(p=>esc(p.position.split(' · ')[0])+': '+esc(p.name)).join('<br>')}</small></div>${canEdit()?`<button class="additem" data-item-aspect="${a.id}" data-item-actions="${i.actions.map(t=>t.id).join(',')}">${icon('plus')} Tambah eviden</button>`:''}</div>${es.map(e=>evidenceRow(e,a.id)).join('')||'<p class="smallhint">Belum ada rekod bagi item ini.</p>'}</section>`;}).join('');}
function componentPage(kind){return head(kind==='strength'?'Komponen 01':'Komponen 03',kind==='strength'?'Kekuatan Kami':'Kemenjadian Kami','Profil, data sokongan dan pencapaian '+esc(db.settings.school)+' mengikut tahun.')+`<div class="grid2">${componentNames[kind].map((name,index)=>{const id=kind+'-'+index;const r=(db.components||[]).find(r=>r.key===id&&Number(r.year)===year);return `<section class="panel apptile"><span class="badge green">${kind==='strength'?'A':'K'}${index+1}</span><h2>${esc(name)}</h2><p>${esc(r?.summary||'Belum diisi. Rekodkan maklumat sekolah dan pautan sokongan di sini.')}</p>${r?.value?`<h3>${esc(r.value)} <small>${esc(r.unit)}</small></h3>`:''}<div class="actions">${r?.url?link(r.url,'Buka eviden',true):''}${admin()?(r?`<button class="iconbtn" onclick="componentForm('${kind}',${index})" title="Ubah" aria-label="Ubah">${icon('edit')}</button>`:`<button class="primary" onclick="componentForm('${kind}',${index})">${icon('plus')} Isi maklumat</button>`):''}</div></section>`;}).join('')}</div>`;}
strength=()=>componentPage('strength');outcomes=()=>outcomesPage();
function componentForm(kind,index){const key=kind+'-'+index,r=(db.components||[]).find(r=>r.key===key&&Number(r.year)===year)||{};modal(componentNames[kind][index],`<label class="field">Huraian / ringkasan<textarea name="summary" required maxlength="3000">${esc(r.summary||'')}</textarea></label><div class="grid2">${field('Nilai / bilangan (jika berkaitan)','value',r.value||'','maxlength="100"')}${field('Unit / ukuran','unit',r.unit||'','maxlength="100"')}</div>${field('Pautan dokumen atau dashboard sokongan','url',r.url||'','type="url"')}<p class="smallhint">Masukkan nilai sebenar berdasarkan rekod sekolah.</p>`,'Simpan',async fd=>{db=await api('saveComponent',{key,year,summary:fd.get('summary'),value:fd.get('value'),unit:fd.get('unit'),url:fd.get('url')});});}

function sourceLinkBtn(e){const s=evidenceSource(e);return s.url?link(s.url,'Buka eviden',true):s.appUrl?link(s.appUrl,'Buka sumber',true):'';}
function sourceDisplay(e,withLink=true){const s=evidenceSource(e);return `<div class="sourcecell"><span>${esc(s.name)}</span>${withLink?sourceLinkBtn(e)||'<small>Pautan belum tersedia</small>':''}</div>`;}

function dashboardScoreRow(){const vals=outcomeCats.map((c,i)=>outcomeValue(i));const muridVal=vals[0]+vals[1]+vals[2],guruVal=vals[3]+vals[4],totalVal=muridVal+guruVal;return `<section class="panel"><div class="panelhead"><h2>Pencapaian Kami</h2><button class="plain" data-nav="outcomes">Butiran ${icon('arrow')}</button></div><div class="formbody"><div class="scoregroup3">${scoreCard('Skor keseluruhan',totalVal,100,'S')}${scoreCard('Kemenjadian Murid',muridVal,80,'A')}${scoreCard('Pencapaian Guru dan Sekolah',guruVal,20,'B')}</div></div></section>`;}
function gapList(title,items,emptyText){return `<section class="panel"><div class="panelhead"><h2>${title}</h2><span class="badge ${items.length?'amber':'green'}">${items.length}</span></div><div class="formbody">${items.length?items.map(a=>`<div class="gaprow"><span class="aspectcode">${a.id}</span><span>${esc(a.name)}</span></div>`).join(''):`<div class="empty">${emptyText}</div>`}</div></section>`;}
function strengthGap(){return componentNames.strength.map((name,i)=>({id:'A'+(i+1),name,filled:(db.components||[]).some(r=>r.key==='strength-'+i&&Number(r.year)===year&&(r.summary||r.value))})).filter(x=>!x.filled);}
function barColor(pct){return pct>=80?'#4e9778':pct>=40?'#e0a83e':pct>0?'#c65b5b':'#dfe6e2';}
function heroBanner(){const vals=outcomeCats.map((c,i)=>outcomeValue(i));const totalVal=vals.reduce((a,b)=>a+b,0);const covered=aspects.filter(a=>evidenceFor(a.id).length).length,coveragePct=aspects.length?Math.round(covered/aspects.length*1000)/10:0;const strengthDone=componentNames.strength.length-strengthGap().length;return `<section class="panel herobanner"><div class="herostat"><div class="heroicon">${icon('chart')}</div><div class="heronum">${totalVal.toFixed(1)}<small>/100</small></div><div class="herolabel">Skor Pencapaian Kami</div></div><div class="herostat"><div class="heroicon">${icon('folder')}</div><div class="heronum">${coveragePct}<small>%</small></div><div class="herolabel">Liputan aspek berbukti</div></div><div class="herostat"><div class="heroicon">${icon('leaf')}</div><div class="heronum">${strengthDone}<small>/${componentNames.strength.length}</small></div><div class="herolabel">Kekuatan Kami diisi</div></div></section>`;}
function chapterHead(num,title){return `<div class="panelhead"><div style="display:flex;align-items:center;gap:12px"><div class="tile">${num}</div><h2>${esc(title)}</h2></div></div>`;}
function pdcaColor(p){return {P:'#466bac',D:'#2a7857',C:'#947123',A:'#7a60a2'}[p]||'#76847c';}
function pdcaBreakdown(rs){const maps=rs.flatMap(e=>mappingsFor(e.id));const counts=Object.keys(pdcaNames).map(p=>({p,n:maps.filter(m=>m.pdca.includes(p)).length}));const max=Math.max(...counts.map(c=>c.n),1);return counts.map(c=>`<div class="chartrow"><span>${c.p} · ${pdcaNames[c.p]}</span><div class="bar"><i style="width:${c.n/max*100}%;background:${pdcaColor(c.p)}"></i></div><span>${c.n}</span></div>`).join('');}
function evidenceCountByStandard(rs){const items=CATALOG.standards.map(s=>({id:s.id,n:rs.filter(e=>mappingsFor(e.id).some(m=>aspects.find(a=>a.id===m.aspectId)?.standard===s.id)).length}));const max=Math.max(...items.map(x=>x.n),1);return items.map(x=>`<div class="chartrow"><span>Standard ${x.id}</span><div class="bar"><i style="width:${x.n/max*100}%;background:#4e9778"></i></div><span>${x.n}</span></div>`).join('');}
function dashboard(){

function aspectRumusan(aspectId){const items=(db.rumusanSkor||[]).filter(r=>r.level==='item'&&r.id.startsWith(aspectId+'.'));return items.length?items.reduce((s,r)=>s+r.score,0)/items.length:null;}

function reports(){

 const standards=CATALOG.standards.filter(s=>reportStd==='all'||s.id===reportStd);
 return head('Rujukan nazir','Laporan Eviden',db.settings.school+' · '+year,`<button id="export">${icon('download')} Eksport CSV</button><button id="print">Cetak / PDF</button>`)+`<div class="toolbar no-print"><div class="search">${icon('search')}<input id="search" aria-label="Cari aspek atau eviden" placeholder="Cari standard, aspek, eviden atau sumber…" value="${esc(query)}"></div><select id="reportStd" aria-label="Tapis standard"><option value="all">Semua standard</option>${CATALOG.standards.map(s=>`<option value="${s.id}" ${reportStd===s.id?'selected':''}>Standard ${s.id} · ${esc(s.name)}</option>`).join('')}</select><select id="reportAspect" aria-label="Tapis aspek"><option value="all">Semua aspek</option>${aspectPool.map(a=>`<option value="${a.id}" ${reportAspect===a.id?'selected':''}>${a.id} · ${esc(a.name)}</option>`).join('')}</select></div>`+standards.map(s=>{const sections=s.aspects.filter(a=>reportAspect==='all'||a.id===reportAspect).map(a=>{const match=(s.id+' '+s.name+' '+a.id+' '+a.name).toLowerCase().includes(query.toLowerCase());const es=evidenceFor(a.id).filter(e=>match||(e.name+' '+evidenceSource(e).name).toLowerCase().includes(query.toLowerCase()));return es.length?`<section class="reportaspect"><h3>${a.id} · ${esc(a.name)}</h3><table><thead><tr><th>Nama eviden</th><th>Sumber / pautan</th></tr></thead><tbody>${es.map(e=>`<tr><td>${esc(e.name)}</td><td>${sourceDisplay(e)}</td></tr>`).join('')}</tbody></table></section>`:'';}).join('');return sections?`<section class="panel reportstandard"><div class="panelhead"><h2>Standard ${s.id} · ${esc(s.name)}</h2></div>${sections}</section>`:'';}).join('');
}

function exportCsv(){const rows=[['Sekolah','Tahun','Standard','Aspek','Nama aspek','Nama eviden','Sumber','Pautan eviden','Pautan sumber']];aspects.forEach(a=>evidenceFor(a.id).forEach(e=>{const s=evidenceSource(e);rows.push([db.settings.school,year,a.standard,a.id,a.name,e.name,s.name,s.url,s.appUrl]);}));const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Laporan-Eviden-${year}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
// Pautan rasmi sekolah ditetapkan di Tetapan Admin; kosong = butang disembunyikan.

function files(){const rs=records().filter(e=>e.management);return head('Dokumentasi sekolah','Pengurusan SK@S','Fail pengurusan rasmi daripada Folder Pengurusan Sistem Kualiti@Sekolah.')+`<section class="panel"><div class="panelhead"><h2>Fail daripada folder rasmi</h2><span class="badge gray">${rs.length} fail</span></div><p class="smallhint" style="padding:0 20px">Semua item di bawah dirujuk dalam folder rasmi. Eviden lain dipaparkan di Pengurusan Kami dan Laporan Eviden.</p><div class="formbody">${rs.map(e=>evidenceRow(e)).join('')||'<div class="empty">Belum ada fail pengurusan.</div>'}</div></section>`;}
function strength(){const cards=[['A1','Guru','Data profil guru, pengalaman, jawatan strategik dan kepakaran.'],['A2','Kualiti Pengajaran dan Pembelajaran (PdP)','Data amalan PdP, PLC, e-RPH dan pemantauan instruksional.'],['A3','Staf Bukan Guru','Data kompetensi dan penugasan AKP.'],['A4','Prasarana Akademik','Data bilik khas, PSS, makmal dan sumber pembelajaran.'],['A5','Prasarana Sukan dan Kokurikulum','Data kemudahan, penyertaan dan pencapaian kokurikulum.'],['A6','Prasarana Hal Ehwal Murid','Data asrama, keselamatan, kesihatan dan kebajikan murid.'],['A7','Persekitaran Digital','Data aplikasi sekolah dan dashboard analitik.'],['A8','Asrama','Data pengurusan dan sokongan kehidupan murid asrama.'],['A9','Sokongan Ibu Bapa, Komuniti dan Pihak Swasta','Data jaringan, sumbangan dan kolaborasi strategik.']];return head('Komponen 01','Kekuatan Kami','Paparan berasaskan Instrumen Kekuatan Kami sekolah · '+year)+`<div class="note" style="margin:0 0 20px">${icon('info')}<span>Sumber utama ialah instrumen Kekuatan Kami. Dashboard analitik digunakan untuk pemetaan dan rumusan data; tiada pengisian manual berulang.</span></div><div class="actions" style="margin-bottom:20px">${setURL('strengthUrl')?`<a class="button primary" href="${esc(setURL('strengthUrl'))}" target="_blank" rel="noopener">${icon('sheet')} Buka instrumen</a>`:''}${setURL('dashboardUrl')?`<a class="button" href="${esc(setURL('dashboardUrl'))}" target="_blank" rel="noopener">${icon('chart')} Buka dashboard analitik</a>`:''}</div><div class="grid2">${cards.map(([code,n,d])=>`<section class="panel introcard"><span class="badge green">${code}</span><h3 style="margin-top:12px">${n}</h3><p>${d}</p><span class="smallhint">Data disemak daripada instrumen sumber</span></section>`).join('')}</div>`;}

<script>'use strict';
// Modul Instrumen "Pengurusan Kami" (Std 1–3). Data dari state_.instrumen; semua semakan akses diulang di pelayan.
let insStd='1',insMine=false,insSesi=null,insUnitTab='';
const INS_STATUS_TONE={'Belum diisi':'','Draf':'amber','Dihantar':'sky','Disahkan':'green','Perlu pembetulan':'red'};
navs.splice(navs.findIndex(n=>n[0]==='management')+1,0,['instrumen','Instrumen Pengurusan','check']);
navGroups[0].items.splice(navGroups[0].items.indexOf('management')+1,0,'instrumen');

const ins=()=>db.instrumen;
const insYear=()=>ins().settings.year;
const insSesiNow=()=>insSesi||ins().settings.sesi;
const insRoleAdmin=()=>db.user.role==='Admin';
const insUnitAspect=id=>!!ins().unitAspects[id];
const insActions=item=>item.actions.filter(t=>!ins().excluded.includes(t.id)&&ins().rubric[t.id]);
const insCovers=(aspectId,itemId)=>db.user.role==='PPS'&&ins().myPps.some(p=>p.aspects.includes(aspectId)&&(!p.items.length||p.items.includes(itemId)));
const insCanFill=(aspectId,itemId,unitId)=>insRoleAdmin()||insCovers(aspectId,itemId)||!!(unitId&&insUnitAspect(aspectId)&&ins().settings.unitOpen);
const insCanReview=(aspectId,itemId,unitId)=>insRoleAdmin()||!!(unitId&&insCovers(aspectId,itemId));
const insNeedsName=()=>!['Admin','PPS'].includes(db.user.role);
const insUnits=aspectId=>ins().units.filter(u=>u.aspectId===aspectId&&(u.active===true||String(u.active)==='true'));
const insRecs=(itemId,unitId,sesi)=>ins().scores.filter(r=>r.itemId===itemId&&(r.unitId||'')===(unitId||'')&&Number(r.sesi)===Number(sesi??insSesiNow()));
function insName(){try{return localStorage.getItem('skas-ins-name')||'';}catch{return '';}}
function insSaveName(v){try{localStorage.setItem('skas-ins-name',v);}catch{}}

/** Sama dengan scoreFor_ di Rubrik.js; pelayan mengira semula semasa simpan. */
function insScore(rule,crit){const n={A3:3,B3:3,A4:4,B4:4,C4:4}[rule],c=new Set(crit).size,f=crit.includes(1);if(c===n)return 4;if(!c)return 0;if(rule==='C4')return c;if(rule==='B4')return f?c:0;if(rule==='B3')return c===2?(f?3:2):1;if(rule==='A3')return f?(c===2?3:2):1;return f?Math.max(c,2):1;}
function insStatus(recs,total){if(!recs.length)return 'Belum diisi';const s=recs.map(r=>r.status);if(s.includes('Perlu pembetulan'))return 'Perlu pembetulan';if(recs.length===total&&s.every(x=>x==='Disahkan'))return 'Disahkan';if(recs.length===total&&s.every(x=>x==='Dihantar'))return 'Dihantar';return 'Draf';}
function insBadge(st){return `<span class="badge ${INS_STATUS_TONE[st]||''}">${esc(st)}</span>`;}
/** Peratus keseluruhan = Σ skor ÷ (4 × tindakan diisi) × 100. */
function insPct(recs){return recs.length?Math.round(recs.reduce((t,r)=>t+Number(r.score||0),0)/(4*recs.length)*10000)/100:null;}
function insScope(filterFn,confirmed){const units=new Set(ins().units.filter(u=>u.active===true||String(u.active)==='true').map(u=>u.id));return ins().scores.filter(r=>Number(r.sesi)===insSesiNow()&&(!r.unitId||units.has(r.unitId))&&(!confirmed||r.status==='Disahkan')&&filterFn(r));}
function insTotal(items){return items.reduce((t,{a,i})=>t+insActions(i).length*(insUnitAspect(a.id)?insUnits(a.id).length:1),0);}
function insMeter(pct){return `<div class="ins-meter" title="${pct===null?'Belum diisi':pct+'%'}"><i style="width:${pct||0}%;background:${barColor(pct||0)}"></i></div>`;}
function insAllItems(){return CATALOG.standards.flatMap(s=>s.aspects.flatMap(a=>a.items.filter(i=>insActions(i).length).map(i=>({s,a,i}))));}

function instrumenPage(){
 if(!db.instrumen)return head('Komponen 02','Instrumen Pengurusan','Pengisian skor Instrumen SKPM Kualiti@Sekolah Std 1–3.')+`<div class="note">${icon('info')}<span>Modul instrumen hanya tersedia apabila portal disambungkan ke akaun Google sekolah.</span></div>`;
 const cfg=ins().settings,sesi=insSesiNow(),all=insAllItems();
 const curAll=insScope(()=>true,false),conf=insScope(()=>true,true),total=insTotal(all);
 const mineOnly=x=>!insMine||insCovers(x.a.id,x.i.id);
 const stds=CATALOG.standards.filter(s=>all.some(x=>x.s.id===s.id));
 const list=all.filter(x=>x.s.id===insStd&&mineOnly(x));
 const sesiOpts=Array.from({length:cfg.sesiCount},(_,k)=>k+1).map(k=>`<option value="${k}" ${k===sesi?'selected':''}>Sesi ${k}${k===cfg.sesi?' (semasa)':''}</option>`).join('');
 const editable=sesi===cfg.sesi||insRoleAdmin();
 let body=head('Komponen 02','Instrumen Pengurusan',`Pengisian skor Std 1–3 tahun ${cfg.year}. Tanda kriteria yang dipenuhi; skor dikira mengikut rubrik instrumen.`,`<label class="field" style="margin:0"><select id="insSesi" aria-label="Sesi">${sesiOpts}</select></label>`);
 if(Number(year)!==cfg.year)body+=`<div class="note" style="margin:0 0 16px">${icon('info')}<span>Instrumen menggunakan tahun penilaian aktif ${cfg.year}, bukan tahun ${year} yang dipilih di atas.</span></div>`;
 if(!editable)body+=`<div class="note" style="margin:0 0 16px">${icon('info')}<span>Sesi ${sesi} bukan sesi semasa. Paparan baca sahaja.</span></div>`;
 body+=`<div class="summary">${stat('Skor disahkan',insPct(conf)===null?'–':insPct(conf).toFixed(2)+'%',conf.length+' tindakan disahkan','check')}${stat('Skor semasa',insPct(curAll)===null?'–':insPct(curAll).toFixed(2)+'%','Termasuk draf','chart')}${stat('Tindakan diisi',curAll.length+' / '+total,'Merentas semua unit aktif','folder')}${stat('Pengisian unit',cfg.unitOpen?'Dibuka':'Ditutup','Ketua Panitia / guru penasihat','users')}</div>`;
 body+=`<div class="ins-std">${stds.map(s=>`<button data-ins-std="${s.id}" class="${s.id===insStd?'active':''}">Std ${s.id}</button>`).join('')}${db.user.role==='PPS'?`<label class="check" style="margin-left:auto"><input type="checkbox" id="insMine" ${insMine?'checked':''}> Item saya sahaja</label>`:''}</div>`;
 const byAspect={};list.forEach(x=>(byAspect[x.a.id]=byAspect[x.a.id]||{a:x.a,items:[]}).items.push(x));
 body+=Object.values(byAspect).map(({a,items})=>{
  const unitMode=insUnitAspect(a.id),units=unitMode?insUnits(a.id):[];
  return `<section class="panel" style="margin-bottom:16px"><div class="panelhead"><div><h3 style="margin:0">${a.id} ${esc(a.name)}</h3>${unitMode?`<small class="muted">${units.length} unit aktif · diisi untuk setiap unit</small>`:''}</div>${unitMode?`<button data-ins-matrix="${a.id}">${icon('grid')} Matriks unit</button>`:''}</div><div>${items.map(({i})=>{
   const n=insActions(i).length,recs=unitMode?insScope(r=>r.itemId===i.id,false):insRecs(i.id,'');
   const st=unitMode?`${units.filter(u=>insRecs(i.id,u.id).length).length}/${units.length} unit`:'';
   const pct=insPct(recs),ppsNames=db.pps.filter(p=>Number(p.year)===insYear()&&p.aspects.includes(a.id)&&(!(p.items||[]).length||p.items.includes(i.id))).map(p=>p.name);
   return `<div class="ins-item"><span class="aspectcode">${i.id}</span><div><h4>${esc(i.name)}</h4><small>${n} tindakan${ppsNames.length?' · PPS: '+esc(ppsNames.join(', ')):''}</small></div>${insMeter(pct)}<div style="display:flex;gap:8px;align-items:center">${unitMode?`<span class="badge">${st}</span>`:insBadge(insStatus(recs,n))}<button ${unitMode?`data-ins-matrix="${a.id}"`:`data-ins-item="${i.id}"`}>${pct===null?'':pct.toFixed(0)+'% · '}${unitMode?'Unit':insCanFill(a.id,i.id,'')&&editable?'Isi':'Lihat'}</button></div></div>`;}).join('')}</div></section>`;}).join('')||`<div class="empty">${insMine?'Tiada item yang ditugaskan kepada anda dalam standard ini. Nyahtanda "Item saya sahaja" untuk melihat semua.':'Tiada item untuk dipaparkan.'}</div>`;
 if(insRoleAdmin())body+=insAdminPanel();
 return body;
}
function insAdminPanel(){
 const cfg=ins().settings,ua=Object.keys(ins().unitAspects),aspectName=id=>aspects.find(a=>a.id===id)?.name||id;
 const cur=insUnitTab||ua[0];
 const rows=ins().units.filter(u=>u.aspectId===cur).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="grid2" style="margin-top:8px"><section class="panel"><div class="panelhead"><h2>Tetapan instrumen</h2></div><form id="insSettings" class="formbody"><div class="grid2"><label class="field">Bilangan sesi setahun<select name="sesiCount">${[2,3].map(k=>`<option ${k===cfg.sesiCount?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">Sesi semasa<select name="sesi">${[1,2,3].map(k=>`<option ${k===cfg.sesi?'selected':''}>${k}</option>`).join('')}</select></label></div><label class="check"><input type="checkbox" name="unitOpen" ${cfg.unitOpen?'checked':''}> Buka pengisian unit kepada Ketua Panitia / guru penasihat tanpa akaun</label><p class="smallhint">Hanya aspek 3.1.2, 3.2.2, 3.2.3 dan 3.2.4. Pengisi wajib menaip nama, dan setiap perubahan direkod. Tutup selepas tarikh akhir pengisian.</p><div class="error formerror" id="insSettingsError"></div><button class="primary" type="submit">${icon('check')} Simpan tetapan</button></form></section>
 <section class="panel"><div class="panelhead"><h2>Senarai unit ${cfg.year}</h2></div><div class="formbody"><label class="field">Aspek<select id="insUnitAspect">${ua.map(id=>`<option value="${id}" ${id===cur?'selected':''}>${id} ${esc(aspectName(id))}</option>`).join('')}</select></label>
 <table class="ins-matrix"><thead><tr><th>Unit</th><th>PIC</th><th>Aktif</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.pic||'–')}</td><td>${u.active===true||String(u.active)==='true'?'Ya':'Tidak'}</td><td><button data-ins-unit="${u.id}">Ubah</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Belum ada unit.</td></tr>'}</tbody></table>
 <label class="field" style="margin-top:14px">Tambah unit (satu nama setiap baris)<textarea id="insNewUnits" rows="4" placeholder="Bahasa Melayu&#10;Matematik&#10;Sains"></textarea></label><div class="ins-bar" style="justify-content:flex-start"><button class="primary" id="insAddUnits">${icon('plus')} Tambah</button><button id="insCopyUnits">Salin dari tahun ${cfg.year-1}</button></div><div class="error formerror" id="insUnitError"></div></div></section></div>`;
}

function insMatrix(aspectId){
 const a=aspects.find(x=>x.id===aspectId),items=a.items.filter(i=>insActions(i).length),units=insUnits(aspectId);
 const cell=(i,u)=>{const recs=insRecs(i.id,u.id),pct=insPct(recs);return `<td><button type="button" data-ins-cell="${i.id}|${u.id}">${insBadge(insStatus(recs,insActions(i).length))}${pct===null?'':' '+pct.toFixed(0)+'%'}</button></td>`;};
 modal(`${a.id} ${esc(a.name)} · Sesi ${insSesiNow()}`,units.length?`<p class="muted">Pilih unit untuk mengisi atau menyemak. ${ins().settings.unitOpen?'Pengisian unit sedang <b>dibuka</b>.':'Pengisian unit terbuka sedang <b>ditutup</b>.'}</p><div style="overflow:auto"><table class="ins-matrix"><thead><tr><th>Unit</th>${items.map(i=>`<th title="${esc(i.name)}">${i.id}</th>`).join('')}</tr></thead><tbody>${units.map(u=>`<tr><td><strong>${esc(u.name)}</strong>${u.pic?`<br><small class="muted">${esc(u.pic)}</small>`:''}</td>${items.map(i=>cell(i,u)).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada unit aktif untuk aspek ini. ${insRoleAdmin()?'Tambah unit di bahagian Senarai unit.':'Hubungi admin.'}</div>`);
 $$('[data-ins-cell]').forEach(b=>b.onclick=()=>{const [itemId,unitId]=b.dataset.insCell.split('|');insItemForm(itemId,unitId);});
}

function insItemForm(itemId,unitId=''){
 const x=insAllItems().find(v=>v.i.id===itemId),{a,i}=x,cfg=ins().settings,sesi=insSesiNow();
 const unit=unitId?ins().units.find(u=>u.id===unitId):null,acts=insActions(i),recs=insRecs(i.id,unitId);
 const status=insStatus(recs,acts.length),locked=status==='Disahkan';
 const fill=insCanFill(a.id,i.id,unitId)&&(sesi===cfg.sesi||insRoleAdmin())&&!locked;
 const review=insCanReview(a.id,i.id,unitId),R=ins().rubric,rn=['i','ii','iii','iv'];
 const evPool=db.evidence.filter(e=>Number(e.year)===cfg.year&&mappingsFor(e.id).some(m=>m.aspectId===a.id));
 const note=recs.find(r=>r.reviewNote)?.reviewNote;
 const card=t=>{const r=recs.find(v=>v.actionId===t.id),rb=R[t.id],crit=(r?.criteria||[]).map(Number),ev=r?.evidenceIds||[];
  const pool=[...evPool].sort((p,q)=>Number(mappingsFor(q.id).some(m=>m.actionIds.includes(t.id)))-Number(mappingsFor(p.id).some(m=>m.actionIds.includes(t.id))));
  const extra=ev.filter(id=>!pool.some(e=>e.id===id));
  return `<div class="ins-act ${fill?'':'locked'}" data-ins-act="${t.id}" data-version="${r?r.version:0}" data-rule="${rb.rule}"><div class="ins-acthead"><div><strong>${t.id.split(':')[1]}) ${esc(t.label)}</strong> <span class="pdca"><span class="${t.pdca}">${t.pdca}</span></span>${r?`<br><small class="muted">${esc(r.status)} · ${esc(r.filledByName||'')}</small>`:''}</div><div class="ins-score" data-ins-score>${r?r.score:'–'}</div></div>
  ${rb.criteria.map((c,k)=>`<label class="ins-crit"><input type="checkbox" value="${k+1}" ${crit.includes(k+1)?'checked':''} ${fill?'':'disabled'}><span>(${rn[k]}) ${esc(c)}</span></label>`).join('')}
  <label class="ins-crit"><input type="checkbox" data-ins-zero ${r&&!crit.length?'checked':''} ${fill?'':'disabled'}><span><i>Tiada kriteria dipenuhi (skor 0)</i></span></label>
  <small class="muted">Peraturan ${rb.rule}: ${esc(ins().rules[rb.rule])}</small>
  <div class="ins-ev">${pool.length?pool.map(e=>`<label title="${esc(e.name)}"><input type="checkbox" data-ins-ev value="${e.id}" ${ev.includes(e.id)?'checked':''} ${fill?'':'disabled'}>${esc(e.name.length>48?e.name.slice(0,46)+'…':e.name)}</label>`).join(''):'<small class="muted">Tiada eviden dipetakan ke aspek ini lagi.</small>'}${extra.map(id=>`<input type="hidden" data-ins-ev-keep value="${esc(id)}">`).join('')}</div>
  <label class="field" style="margin-top:8px">Catatan<textarea rows="2" maxlength="1200" data-ins-note ${fill?'':'disabled'}>${esc(r?.catatan||'')}</textarea></label></div>`;};
 const title=`${i.id} ${esc(i.name)}${unit?' · '+esc(unit.name):''}`;
 modal(title,`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">${insBadge(status)}<span class="muted">Sesi ${sesi} · ${cfg.year} · ${recs.length}/${acts.length} tindakan diisi${insPct(recs)===null?'':' · '+insPct(recs).toFixed(2)+'%'}</span></div>
 ${note?`<div class="note" style="margin-bottom:12px">${icon('info')}<span><b>Nota penyemak:</b> ${esc(note)}</span></div>`:''}
 ${fill&&insNeedsName()?`<label class="field">Nama pengisi *<input id="insFiller" maxlength="100" placeholder="Contoh: Pn. Aini, Ketua Panitia BM" value="${esc(insName())}"></label>`:''}
 ${acts.map(card).join('')}
 <div class="ins-bar ins-sticky">${fill&&sesi>1&&recs.length<acts.length?`<button type="button" id="insCopy">Salin dari sesi ${sesi-1}</button>`:''}${recs.length?`<button type="button" id="insHistory">Sejarah</button>`:''}${fill?`<button type="button" id="insSave">${icon('check')} Simpan draf</button><button type="button" class="primary" id="insSubmit">Hantar untuk pengesahan</button>`:''}</div>
 ${review&&recs.length?`<div class="ins-review"><strong>Semakan</strong><label class="field" style="margin-top:8px">Nota penyemak<textarea id="insReviewNote" rows="2" maxlength="1200" placeholder="Wajib jika memulangkan untuk pembetulan"></textarea></label><div class="ins-bar">${status==='Disahkan'?`<button type="button" id="insReopen">Buka semula</button>`:''}<button type="button" data-ins-review="Perlu pembetulan">Perlu pembetulan</button>${status==='Dihantar'?`<button type="button" class="primary" data-ins-review="Disahkan">${icon('check')} Sahkan</button>`:''}</div></div>`:''}
 <div id="insHistoryBox"></div>`);
 const base={year:cfg.year,sesi,itemId:i.id,unitId};
 const filler=()=>{const el=$('#insFiller');if(!el)return '';const v=el.value.trim();if(!v)throw Error('Taip nama pengisi.');insSaveName(v);return v;};
 const run=async(action,payload,msg)=>{$('#formerror').textContent='';try{db=await api(action,payload);render();toast(msg);insItemForm(itemId,unitId);}catch(e){$('#formerror').textContent=errorText(e);}};
 const critOf=el=>[...el.querySelectorAll('.ins-crit input:not([data-ins-zero]):checked')].map(x=>Number(x.value));
 $$('[data-ins-act]').forEach(el=>{el.querySelectorAll('input,textarea').forEach(c=>c.addEventListener('input',()=>{el.dataset.dirty='1';}));el.querySelectorAll('.ins-crit input').forEach(c=>c.onchange=()=>{el.dataset.dirty='1';const zero=el.querySelector('[data-ins-zero]');if(c===zero&&zero.checked)el.querySelectorAll('.ins-crit input:not([data-ins-zero])').forEach(x=>x.checked=false);else if(c!==zero&&c.checked)zero.checked=false;const crit=critOf(el);el.querySelector('[data-ins-score]').textContent=crit.length||zero.checked?insScore(el.dataset.rule,crit):'–';});});
 // Hanya tindakan yang diubah; tindakan baharu tanpa kriteria perlu tanda "skor 0" secara sedar.
 const collect=()=>$$('[data-ins-act]').filter(el=>el.dataset.dirty).map(el=>{const crit=critOf(el),zero=el.querySelector('[data-ins-zero]').checked;if(!crit.length&&!zero&&Number(el.dataset.version)===0)throw Error('Tindakan '+el.dataset.insAct.split(':')[1]+': tanda kriteria, atau pilih "Tiada kriteria dipenuhi".');return el;}).map(el=>({actionId:el.dataset.insAct,version:Number(el.dataset.version),criteria:critOf(el),evidenceIds:[...el.querySelectorAll('[data-ins-ev]:checked'),...el.querySelectorAll('[data-ins-ev-keep]')].map(x=>x.value),catatan:el.querySelector('[data-ins-note]').value.trim()}));
 if($('#insSave'))$('#insSave').onclick=()=>{try{const scores=collect();if(!scores.length){toast('Tiada perubahan untuk disimpan.');return;}run('saveScores',{...base,filledByName:filler(),scores},'Draf disimpan.');}catch(e){$('#formerror').textContent=errorText(e);}};
 if($('#insSubmit'))$('#insSubmit').onclick=async()=>{let name,scores;try{name=filler();scores=collect();}catch(e){$('#formerror').textContent=errorText(e);return;}
  // Simpan dahulu; jika hantar gagal, borang dibuka semula dengan versi terkini supaya klik seterusnya tidak ditolak.
  try{if(scores.length)db=await api('saveScores',{...base,filledByName:name,scores});}catch(e){$('#formerror').textContent=errorText(e);return;}
  try{db=await api('submitItem',{...base,filledByName:name});render();toast('Item dihantar untuk pengesahan.');insItemForm(itemId,unitId);}catch(e){render();insItemForm(itemId,unitId);$('#formerror').textContent=errorText(e);}};
 if($('#insCopy'))$('#insCopy').onclick=()=>{try{run('copyPrevious',{...base,filledByName:filler()},'Skor sesi sebelum disalin sebagai draf.');}catch(e){$('#formerror').textContent=errorText(e);}};
 $$('[data-ins-review]').forEach(b=>b.onclick=()=>{if(b.dataset.insReview==='Perlu pembetulan'&&!$('#insReviewNote').value.trim()){$('#formerror').textContent='Tulis nota penyemak supaya pengisi tahu apa yang perlu dibetulkan.';return;}run('reviewItem',{...base,decision:b.dataset.insReview,note:$('#insReviewNote').value.trim()},b.dataset.insReview==='Disahkan'?'Item disahkan.':'Item dipulangkan untuk pembetulan.');});
 if($('#insReopen'))$('#insReopen').onclick=()=>{if(confirm('Buka semula item ini? Skor disahkan akan kembali ke Draf dan dikeluarkan daripada rumusan.'))run('reviewItem',{...base,decision:'Buka semula',note:$('#insReviewNote').value.trim()},'Item dibuka semula.');};
 if($('#insHistory'))$('#insHistory').onclick=async()=>{const box=$('#insHistoryBox');box.innerHTML='<p class="muted">Memuatkan sejarah…</p>';try{const out=await Promise.all(acts.map(t=>api('scoreHistory',{scoreId:[cfg.year,sesi,t.id,unitId].join('|')})));const rows=out.flatMap((o,k)=>o.history.map(h=>({...h,act:acts[k].id}))).sort((p,q)=>String(q.at).localeCompare(String(p.at)));box.innerHTML=`<h3 style="margin:16px 0 6px">Sejarah perubahan</h3>`+(rows.map(h=>{const af=h.after?JSON.parse(h.after):{};return `<div class="ins-hist"><b>${esc(h.act.split(':')[1])})</b> ${esc(h.action)} · ${esc(h.name||h.user)} · ${esc(String(h.at).slice(0,16).replace('T',' '))}${af.score!==undefined?' · skor '+esc(af.score):''}</div>`;}).join('')||'<p class="muted">Tiada sejarah.</p>');}catch(e){box.innerHTML=`<p class="error">${esc(errorText(e))}</p>`;}};
}

function insUnitForm(u){
 modal('Ubah unit',`${field('Nama unit *','name',u.name,'required maxlength="120"')}${field('PIC (Ketua Panitia / guru penasihat)','pic',u.pic||'','maxlength="120"')}<label class="check"><input type="checkbox" name="active" ${u.active===true||String(u.active)==='true'?'checked':''}> Aktif (dikira dalam peratus)</label>`,'Simpan',async fd=>{db=await api('saveUnit',{id:u.id,year:u.year,aspectId:u.aspectId,name:fd.get('name').trim(),pic:fd.get('pic').trim(),active:fd.get('active')==='on'});});
}

function bindInstrumen(){
 if(view!=='instrumen'||!db.instrumen)return;
 $$('[data-ins-std]').forEach(b=>b.onclick=()=>{insStd=b.dataset.insStd;render();});
 if($('#insMine'))$('#insMine').onchange=e=>{insMine=e.target.checked;render();};
 if($('#insSesi'))$('#insSesi').onchange=e=>{insSesi=Number(e.target.value);render();};
 $$('[data-ins-item]').forEach(b=>b.onclick=()=>insItemForm(b.dataset.insItem,''));
 $$('[data-ins-matrix]').forEach(b=>b.onclick=()=>insMatrix(b.dataset.insMatrix));
 if($('#insSettings'))$('#insSettings').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);$('#insSettingsError').textContent='';try{db=await api('saveInstrumenSettings',{sesiCount:Number(fd.get('sesiCount')),sesi:Number(fd.get('sesi')),unitOpen:fd.get('unitOpen')==='on'});insSesi=null;render();toast('Tetapan instrumen disimpan.');}catch(err){$('#insSettingsError').textContent=errorText(err);}};
 if($('#insUnitAspect'))$('#insUnitAspect').onchange=e=>{insUnitTab=e.target.value;render();};
 const ua=()=>$('#insUnitAspect').value;
 if($('#insAddUnits'))$('#insAddUnits').onclick=async()=>{$('#insUnitError').textContent='';try{const before=ins().units.length;db=await api('addUnits',{year:insYear(),aspectId:ua(),names:$('#insNewUnits').value});insUnitTab=ua();render();toast((ins().units.length-before)+' unit ditambah.');}catch(err){$('#insUnitError').textContent=errorText(err);}};
 if($('#insCopyUnits'))$('#insCopyUnits').onclick=async()=>{$('#insUnitError').textContent='';try{const before=ins().units.length;db=await api('copyUnits',{fromYear:insYear()-1,year:insYear()});render();toast((ins().units.length-before)+' unit disalin.');}catch(err){$('#insUnitError').textContent=errorText(err);}};
 $$('[data-ins-unit]').forEach(b=>b.onclick=()=>insUnitForm(ins().units.find(u=>u.id===b.dataset.insUnit)));
}
// Index.html mungkin sudah render sebelum skrip ini dimuatkan; render semula supaya menu instrumen muncul.
if(typeof db!=='undefined'&&db&&!db.needsRole&&document.querySelector('.shell'))render();
</script>
