/* global self */
const DEMO_SS = 'DEMO_SPREADSHEET_ID_0000000000';
const DEMO_ADMIN = 'admin@sktamanilmu.edu.my', DEMO_PPS = 'aisyah@sktamanilmu.edu.my';
let demoBooks = {}, demoFiles = {}, demoUser = DEMO_ADMIN, demoCache = {};

function demoSheet(book, name, data) {
  const s = { name, data: data || [] };
  const width = () => Math.max(0, ...s.data.map(r => r.length));
  Object.assign(s, {
    getName: () => s.name, setName: n => { s.name = n; return s; },
    getLastRow: () => { let n = s.data.length; while (n && (s.data[n - 1] || []).every(v => v === '' || v == null)) n--; return n; },
    getLastColumn: () => width(), setFrozenRows() { return s; },
    appendRow: r => { s.data.splice(s.getLastRow(), 0, r.slice()); return s; },
    deleteRow: i => { s.data.splice(i - 1, 1); return s; },
    getDataRange: () => s.getRange(1, 1, Math.max(1, s.getLastRow()), Math.max(1, width())),
    getRange(r, c, nr = 1, nc = 1) {
      const g = {
        setBackground: () => g, setFontColor: () => g, setFontWeight: () => g,
        getValues: () => Array.from({ length: nr }, (_, i) => Array.from({ length: nc }, (_, j) => { const v = (s.data[r - 1 + i] || [])[c - 1 + j]; return v == null ? '' : v; })),
        setValues(v) { v.forEach((row, i) => { const k = r - 1 + i; while (s.data.length <= k) s.data.push([]); row.forEach((x, j) => { s.data[k][c - 1 + j] = x; }); }); return g; },
        setValue(x) { return g.setValues([[x]]); },
        clearContent() { for (let i = 0; i < nr; i++) { const row = s.data[r - 1 + i]; if (row) for (let j = 0; j < nc; j++) row[c - 1 + j] = ''; } return g; }
      };
      return g;
    }
  });
  return s;
}
function demoBook(id, tabs) {
  const b = { id, sheets: [] };
  Object.assign(b, {
    getId: () => id, getUrl: () => '', getSheets: () => b.sheets.slice(),
    getSheetByName: n => b.sheets.find(s => s.name === n) || null,
    insertSheet: n => { const s = demoSheet(b, n); b.sheets.push(s); return s; },
    deleteSheet: s => { b.sheets = b.sheets.filter(x => x !== s); }
  });
  Object.entries(tabs || { Sheet1: [] }).forEach(([n, d]) => b.sheets.push(demoSheet(b, n, d)));
  return b;
}
const toBytes = b64 => { const bin = atob(b64), out = new Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) > 127 ? bin.charCodeAt(i) - 256 : bin.charCodeAt(i); return out; };
const toB64 = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode((b + 256) % 256); }); return btoa(s); };
function demoFile(id) {
  const f = demoFiles[id]; if (!f) throw new Error('Fail tidak ditemui.');
  return {
    getId: () => id, getName: () => f.name, getUrl: () => 'https://example.com/demo-fail/' + encodeURIComponent(f.name),
    setDescription: () => {}, getBlob: () => ({ getContentType: () => f.mime, getBytes: () => toBytes(f.b64) }),
    getParents: () => { let done = false; return { hasNext: () => !done, next: () => { done = true; return { getId: () => f.folder }; } }; },
    setTrashed: () => { delete demoFiles[id]; }
  };
}
function demoFolder(id) {
  return {
    getId: () => id,
    createFile: blob => { const fid = 'file-' + crypto.randomUUID(); demoFiles[fid] = { name: blob.name, mime: blob.mime, b64: toB64(blob.bytes), folder: id }; return demoFile(fid); }
  };
}

self.SpreadsheetApp = { openById: id => { if (!demoBooks[id]) throw new Error('Sheet tidak ditemui.'); return demoBooks[id]; } };
self.Session = { getActiveUser: () => ({ getEmail: () => demoUser }), getEffectiveUser: () => ({ getEmail: () => DEMO_ADMIN }) };
self.LockService = { getDocumentLock: () => ({ waitLock() {}, releaseLock() {} }), getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
self.CacheService = { getScriptCache: () => ({ get: k => demoCache[k] || null, put: (k, v) => { demoCache[k] = v; }, remove: k => { delete demoCache[k]; } }) };
self.PropertiesService = { getScriptProperties: () => ({ getProperty: () => null, setProperty() {} }) };
self.DriveApp = { createFolder: () => demoFolder('folder-demo'), getFolderById: id => demoFolder(id), getFileById: id => demoFile(id) };
self.UrlFetchApp = { fetch: () => { throw new Error('Tiada rangkaian dalam demo.'); } };
self.Utilities = {
  getUuid: () => crypto.randomUUID(), base64Decode: toBytes, base64Encode: toB64,
  newBlob: (bytes, mime, name) => ({ bytes, mime, name }),
  parseCsv: text => String(text).split(/\r?\n/).filter(l => l.trim()).map(l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; })
};

function demoState() { return { books: Object.fromEntries(Object.entries(demoBooks).map(([id, b]) => [id, Object.fromEntries(b.sheets.map(s => [s.name, s.data]))])), files: demoFiles }; }
function demoBootstrap() {
  demoBooks[DEMO_SS] = demoBook(DEMO_SS);

  portalApi('settings', { school: 'SK Taman Ilmu (Demo)', code: 'DEMO001', year: y, schoolType: 'SK', openAccess: false,

  // Akaun PPS contoh supaya pelawat boleh mencuba portal sebagai PPS.
  appendMany_('Pengguna', [{ id: 'contoh-user-pps', name: 'Pn. Aisyah binti Rahman', email: DEMO_PPS, role: 'PPS', active: true }]);
  const pps = read_('PPS').filter(p => p.name === 'Pn. Aisyah binti Rahman');
  if (pps.length) writeAll_('PPS', read_('PPS').map(p => p.name === 'Pn. Aisyah binti Rahman' ? { ...p, email: DEMO_PPS } : p));
}

self.onmessage = ev => {
  const m = ev.data;
  try {
    if (m.type === 'init') {
      demoBooks = {}; demoFiles = (m.state && m.state.files) || {};
      if (m.state && m.state.books) Object.entries(m.state.books).forEach(([id, tabs]) => { demoBooks[id] = demoBook(id, tabs); });
      demoUser = m.user === 'pps' ? DEMO_PPS : m.user === 'tetamu' ? 'pelawat@contoh.my' : DEMO_ADMIN;
      _tenantId_ = ''; demoCache = {};
      if (!demoBooks[DEMO_SS]) { demoUser = DEMO_ADMIN; demoBootstrap(); demoUser = m.user === 'pps' ? DEMO_PPS : m.user === 'tetamu' ? 'pelawat@contoh.my' : DEMO_ADMIN; }
      self.postMessage({ type: 'ready', state: demoState() });
    } else if (m.type === 'call') {
      _sheetCache_ = {};
      const value = JSON.parse(JSON.stringify(portalApi(m.action, m.payload, DEMO_SS) ?? null));
      self.postMessage({ type: 'result', id: m.id, value, state: demoState() });
    }
  } catch (e) {
    self.postMessage({ type: 'result', id: m.id, error: e && e.message || String(e) });
  }
};

const TABLES_ = {
 Eviden:['id','name','year','date','category','unit','source','appId','url','fileId','fileName','management','status','owner','review','updated','version','catatan'],
 Pemetaan_Eviden:['id','evidenceId','aspectId','actionIds','pdca','reference','note'],
 PPS:['id','name','email','position','year','aspects','items'],
 Komponen:['id','key','year','summary','value','unit','url','updated'],
 Aplikasi_BASIS:['id','name','url','description','owner'],
 Pengguna:['id','name','email','role','active'],
 Tetapan:['key','value'],
 Standard_Aspek:['id','standard','aspect','aspectName','item','itemName','action','pdca'],
 Log_Aktiviti:['id','at','user','action','recordId'],
 Rumusan_Skor:['id','level','score']

/** Library pusat: setiap sekolah memanggil melalui bridge dalam Google Sheet sendiri (templates/Bridge.gs.txt).
 * Konfigurasi sekolah disimpan dalam tab Tetapan, bukan Script Properties: Script Properties, cache dan kunci skrip Library dikongsi semua sekolah. */
const APP_VERSION_='2.0.0';
/** Kunci Tetapan yang tidak dihantar ke pelayar. */
const PRIVATE_SETTINGS_=['adminEmail','driveFolderId','licenseCode','licenseKey','licenseStatus','licenseExpiry','appVersion'];
let _tenantId_='',_appUrl_='';
/** ID Sheet datang daripada bridge (pelayan), bukan pelayar. Setiap pelaksanaan Apps Script berasingan, jadi global ini tidak bocor antara sekolah. */
function bindTenant_(ssId){
 const id=String(ssId||'').trim();
 if(!/^[A-Za-z0-9_-]{20,}$/.test(id))throw new Error('Portal mesti dibuka melalui skrip bridge dalam Google Sheet sekolah.');
 if(id!==_tenantId_){_tenantId_=id;_ssCache_=null;_sheetCache_={};}
}
function doGet(e,ssId,appUrl){
 bindTenant_(ssId);_appUrl_=String(appUrl||'');
 const c=conf_();
 if(!c.adminEmail)return setupPage_('setup','');
 const lic=licenseStatus_();
 if(!lic.ok)return setupPage_(c.licenseCode?'lock':'activate',lic.message);
 migrate_(c);
 return HtmlService.createTemplateFromFile('Index').evaluate().setTitle('Portal Eviden SK@S').addMetaTag('viewport','width=device-width, initial-scale=1');
}
/** Sertakan fail HTML lain ke dalam Index melalui templat (<?!= include('Nama'); ?>). */
function include(name){return HtmlService.createHtmlOutputFromFile(name).getContent();}
/** Skrin pemasangan, aktivasi lesen atau kunci (Setup.html). */
function setupPage_(mode,message){
 const t=HtmlService.createTemplateFromFile('Setup');
 Object.assign(t,{mode,message:message||'',owner:isOwner_(),needsLicense:!!licenseUrl_(),year:new Date().getFullYear(),appUrl:_appUrl_});
 return t.evaluate().setTitle('Portal Eviden SK@S').addMetaTag('viewport','width=device-width, initial-scale=1');
}
function conf_(){return Object.fromEntries(read_('Tetapan').map(r=>[r.key,r.value]));}
function setConf_(key,value){upsert_('Tetapan',{key,value},'key');}
/** Pemilik deployment web app (admin sekolah yang memasang). Hanya dia boleh memasang atau mengaktifkan lesen. */
function isOwner_(){const a=mail_(Session.getActiveUser().getEmail()),o=mail_(Session.getEffectiveUser().getEmail());return !!a&&a===o;}
/** Kunci per Sheet sekolah; kunci skrip Library dikongsi semua sekolah dan hanya digunakan sebagai sandaran. */
function lock_(){let l=null;try{l=LockService.getDocumentLock();}catch(e){}return l||LockService.getScriptLock();}
function styleHeader_(sheet,name){sheet.setFrozenRows(1);sheet.getRange(1,1,1,TABLES_[name].length).setBackground('#123d36').setFontColor('#ffffff').setFontWeight('bold');}
function schoolType_(v){const t=String(v||'').trim().toUpperCase();if(!['SK','SM',''].includes(t))throw new Error('Jenis sekolah tidak sah.');return t;}
/** Wizard pemasangan: aktifkan lesen, cipta tab, folder Drive, admin dan tetapan awal. adminEmail ditulis terakhir sebagai tanda siap. */
function install_(p){
 if(!isOwner_())throw new Error('Hanya pemilik deployment web app boleh memasang portal.');
 if(conf_().adminEmail)throw new Error('Portal sudah dipasang.');
 const actor=mail_(Session.getActiveUser().getEmail()),lic=activate_(p.licenseCode,p.licenseKey);
 // Berlesen: nama dan kod sekolah ditetapkan oleh baris lesen, bukan oleh pemasang.
 const licensed=!!licenseUrl_();
 if(licensed&&!lic.name)throw new Error('Nama sekolah belum didaftarkan pada lesen ini. Hubungi pembekal.');
 const school=licensed?text_(lic.name,120,true):text_(p.school,120,true),code=licensed?text_(lic.code||p.licenseCode,20,false).toUpperCase():text_(p.code,20,false);
 const year=year_(p.year),type=schoolType_(p.schoolType);
 const book=spreadsheet_();
 Object.keys(TABLES_).forEach(name=>{
  let sheet=book.getSheetByName(name);
  if(!sheet){sheet=book.insertSheet(name);sheet.appendRow(TABLES_[name]);styleHeader_(sheet,name);}
  else if(sheet.getLastRow()===0){sheet.appendRow(TABLES_[name]);styleHeader_(sheet,name);}
  else if(JSON.stringify(sheet.getRange(1,1,1,TABLES_[name].length).getValues()[0])!==JSON.stringify(TABLES_[name]))throw new Error('Struktur tab '+name+' berbeza. Tiada data dipadam.');
 });
 // Buang helaian kosong lalai Sheet baharu (cth. "Sheet1").
 book.getSheets().forEach(s=>{if(!TABLES_[s.getName()]&&s.getLastRow()===0&&book.getSheets().length>1)book.deleteSheet(s);});
 const folder=DriveApp.createFolder('Eviden SK@S - '+school);
 [['school',school],['code',code],['year',year],['schoolType',type],['logoFileId',''],['openAccess',false],['driveFolderId',folder.getId()],['appVersion',APP_VERSION_]].forEach(x=>setConf_(x[0],x[1]));
 if(!read_('Pengguna').some(r=>mail_(r.email)===actor))append_('Pengguna',{id:Utilities.getUuid(),name:text_(p.adminName,100,false)||'Admin Sekolah',email:actor,role:'Admin',active:true});
 if(!read_('Standard_Aspek').length){const rows=[];catalog_().standards.forEach(s=>s.aspects.forEach(a=>a.items.forEach(i=>i.actions.forEach(t=>rows.push({id:t.id,standard:s.id,aspect:a.id,aspectName:a.name,item:i.id,itemName:i.name,action:t.label,pdca:t.pdca})))));appendMany_('Standard_Aspek',rows);}
 if(p.seed===true||p.seed==='true')loadSeed_(year,actor);
 setConf_('adminEmail',actor);
 return {ok:true};
}
/** Muatkan templat cadangan eviden (Seed.js) sebagai Draf. ID berakhiran tahun, jadi muat semula tidak menduplikasi. */
function loadSeed_(year,owner){
 const have=new Set(read_('Eviden').map(r=>r.id)),now=new Date().toISOString(),ev=[],maps=[];
 // Cadangan eviden ialah eviden Pengurusan Kami (management:false).
 seedTemplate_().forEach(([id,name,category,unit,,ms])=>{
  const eid=id+'-'+year;if(have.has(eid))return;
  ev.push({id:eid,name:name.replace(/\{Y\}/g,year),year,date:'',category,unit,source:'Pautan dokumen',appId:'',url:'',fileId:'',fileName:'',management:false,status:'Draf',owner,review:'Cadangan templat: gantikan dengan dokumen sebenar sekolah.',updated:now,version:1,catatan:''});
  ms.forEach(([aspectId,actionIds,pdca,note],i)=>maps.push({id:'map-'+eid+'-'+i,evidenceId:eid,aspectId,actionIds,pdca,reference:'',note}));
 });
 // Fail pengurusan SK@S sekolah (halaman Pengurusan SK@S), tanpa pemetaan aspek.
 managementTemplate_().forEach(([id,name,category])=>{const eid=id+'-'+year;if(!have.has(eid))ev.push({id:eid,name,year,date:'',category,unit:'JK SK@S',source:'Pautan dokumen',appId:'',url:'',fileId:'',fileName:'',management:true,status:'Draf',owner,review:'Templat fail pengurusan: pautkan folder atau dokumen sebenar sekolah.',updated:now,version:1,catatan:''});});
 appendMany_('Eviden',ev);appendMany_('Pemetaan_Eviden',maps);
 return ev.length;
}
/** Kemas kini skema bila versi Library berubah. read_ sudah menambah lajur baharu; di sini untuk perubahan data. */

  let result;

  else if(action==='loadSample'){requireAdmin_(u);loadSample_(year_(p.year),u.email);}
  else if(action==='clearSample'){requireAdmin_(u);clearSample_();}
  else if(action==='upload'){requireEditor_(u);result=upload_(p,u,false);}
  else if(action==='saveEvidence'){requireEditor_(u);saveEvidence_(p,u);}
  else if(action==='savePps'){requireAdmin_(u);savePps_(p);}
  else if(action==='saveComponent'){requireAdmin_(u);saveComponent_(p);}
  else if(action==='saveApp'){requireAdmin_(u);saveApp_(p);}

  return result||state_(u);
 }finally{lock.releaseLock();}
}

}

   return;

/** Lesen pusat. LESEN_URL (Script Properties Library) ialah web app pelayan lesen milik pembangun (templates/PelayanLesen.gs.txt).
 * Library tidak membuka Master DB terus: web app sekolah berjalan sebagai admin sekolah, jadi openById akan memerlukan mereka
 * diberi akses ke Master DB (dan nampak kod lesen semua sekolah). Tanpa LESEN_URL, Library berjalan tanpa semakan lesen (mod pembangun). */
function licenseUrl_(){return PropertiesService.getScriptProperties().getProperty('LESEN_URL')||'';}
function licenseCacheKey_(){return 'T_'+_tenantId_+'_lesen';}
function callLicense_(op,code,key){
 const res=UrlFetchApp.fetch(licenseUrl_(),{method:'post',contentType:'application/json',payload:JSON.stringify({op,code,key,ss:_tenantId_}),muteHttpExceptions:true,followRedirects:true});
 if(res.getResponseCode()!==200)throw new Error('Pelayan lesen tidak dapat dihubungi ('+res.getResponseCode()+').');
 return JSON.parse(res.getContentText());
}
/** Aktifkan lesen untuk Sheet ini. Satu lesen sekolah boleh digunakan pada beberapa Sheet; nama dan kod sekolah diambil dari lesen. */
function activate_(code,key){
 if(!licenseUrl_())return {name:''};
 code=text_(code,40,true).toUpperCase();key=text_(key,80,true);
 const r=callLicense_('activate',code,key);
 if(!r.ok)throw new Error(r.message||'Kod lesen tidak sah.');
 [['licenseCode',code],['licenseKey',key],['licenseStatus','AKTIF'],['licenseExpiry',r.expiry||'']].forEach(x=>setConf_(x[0],x[1]));
 syncSchool_(r);
 CacheService.getScriptCache().remove(licenseCacheKey_());
 return r;
}
/** Status lesen sekolah ini, dicache 30 minit. Cache Library dikongsi semua sekolah, jadi kunci wajib berprefiks ID Sheet. */
function licenseStatus_(){
 if(!licenseUrl_())return {ok:true};
 const cache=CacheService.getScriptCache(),k=licenseCacheKey_(),hit=cache.get(k);if(hit)return JSON.parse(hit);
 const c=conf_();let r,ttl=1800;
 if(!c.licenseCode)r={ok:false,message:'Portal belum diaktifkan dengan kod lesen.'};
 else try{
  const s=callLicense_('check',c.licenseCode,c.licenseKey),status=s.ok?'AKTIF':String(s.status||'DISEKAT');
  r={ok:!!s.ok,message:s.message||''};
  if(c.licenseStatus!==status)setConf_('licenseStatus',status);
  if(String(c.licenseExpiry||'')!==String(s.expiry||''))setConf_('licenseExpiry',s.expiry||'');
  if(s.ok)syncSchool_(s,c);
 }catch(e){
  // Pelayan lesen tidak dapat dihubungi: guna status terakhir supaya gangguan rangkaian tidak menyekat sekolah.
  const exp=c.licenseExpiry?new Date(c.licenseExpiry):null;
  r={ok:c.licenseStatus==='AKTIF'&&!(exp&&!isNaN(exp)&&exp<new Date()),message:'Status lesen tidak dapat disahkan: '+e.message};ttl=300;
 }
 cache.put(k,JSON.stringify(r),ttl);
 return r;
}
/** Nama dan kod sekolah mengikut baris lesen di Master DB. Perubahan ejaan di Master sampai ke portal dalam masa 30 minit. */
function syncSchool_(r,c){
 c=c||conf_();
 const name=String(r.name||'').trim().slice(0,120),code=String(r.code||'').trim().toUpperCase().slice(0,20);
 if(name&&c.school!==name)setConf_('school',name);
 if(code&&c.code!==code)setConf_('code',code);
}

async function api(action,payload={}){
 if(live&&guestRole&&!payload.guestRole)payload={...payload,guestRole};
 // google.script.run boleh senyap tanpa balasan (cth. pelayar log masuk beberapa akaun Google); had masa supaya pengguna tahu apa berlaku.
 if(live)return new Promise((resolve,reject)=>{
  const ms=action==='load'?45000:180000,t=setTimeout(()=>reject(Error(API_TIMEOUT_MSG)),ms);
  google.script.run.withSuccessHandler(v=>{clearTimeout(t);resolve(v);}).withFailureHandler(e=>{clearTimeout(t);reject(e);}).portalApi(action,payload);
 });
 if(action==='load'){
  let raw=localStorage.getItem('skas-portal-v1');const d=raw?JSON.parse(raw):demoDb();if(!raw)localStorage.setItem('skas-portal-v1',JSON.stringify(d));
  if(d.user.needsRole){
   const gr=payload.guestRole;
   if(gr==='Pemantauan')return {...d,needsRole:false,user:{...d.user,role:'Pemantauan'}};
   if(['Pengisian','Admin'].includes(gr)){
    if(!d.settings.openAccess)throw Error('Akaun ini belum didaftarkan untuk peranan tersebut. Hubungi admin sekolah untuk pendaftaran, atau pilih peranan Pemantau.');
    return {...d,needsRole:false,user:{...d.user,role:gr}};
   }
   return {needsRole:true,user:{name:d.user.name,email:d.user.email},settings:d.settings};
  }
  return d;
 }
 const next=structuredClone(db);
 if(action==='saveComponent'){next.components=(next.components||[]).filter(r=>!(r.key===payload.key&&Number(r.year)===Number(payload.year))).concat({...payload,updated:new Date().toISOString()});}
 if(action==='settings')next.settings={...next.settings,...payload};
 if(action==='saveEvidence'){
  const {mappings,...record}=payload; const old=next.evidence.find(e=>e.id===record.id);
  const e={...record,id:record.id||uid(),owner:old?.owner||next.user.email,updated:new Date().toISOString(),version:(old?.version||0)+1};
  next.evidence=next.evidence.filter(x=>x.id!==e.id).concat(e);
  next.mappings=next.mappings.filter(x=>x.evidenceId!==e.id).concat(mappings.map(m=>({...m,id:uid(),evidenceId:e.id})));
 }
 if(action==='savePps')next.pps=next.pps.filter(x=>x.id!==payload.id).concat({...payload,id:payload.id||uid()});
 if(action==='saveApp')next.apps=next.apps.filter(x=>x.id!==payload.id).concat({...payload,id:payload.id||uid()});
 if(action==='deleteApp'){if(next.evidence.some(e=>e.appId===payload.id))throw Error('Aplikasi ini digunakan oleh eviden sedia ada. Tukar sumber eviden dahulu.');next.apps=next.apps.filter(a=>a.id!==payload.id);}
 if(action==='importRumusanSkor'){next.rumusanSkor=parseRumusanCsv(payload.csv);}
 if(action==='upload')return {url:payload.dataUrl,fileId:'preview',name:payload.name};
 next.log.unshift({id:uid(),action,at:new Date().toISOString(),user:next.user.email});
 localStorage.setItem('skas-portal-v1',JSON.stringify(next));db=next;return next;
}

function scoreBadge(score){if(score===undefined||score===null)return '';const tone=score>=80?'green':score>=40?'amber':'red';const val=Math.round(score*100)/100,text=val===100?'100':val.toFixed(2);return `<span class="badge ${tone}">${text}%</span>`;}
function parseCsvRows(text){const rows=[];let row=[],field='',inQuotes=false;for(let i=0;i<text.length;i++){const c=text[i];if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}else field+=c;}else if(c==='"')inQuotes=true;else if(c===','){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}else field+=c;}if(field||row.length){row.push(field);rows.push(row);}return rows;}
function parseRumusanCsv(text){
 const rows=parseCsvRows(text);
 const validStandards=new Set(CATALOG.standards.map(s=>s.id));
 const validItems=new Set(aspects.flatMap(a=>a.items.map(i=>i.id)));
 const out=[];let currentStandard='';
 rows.forEach(r=>{
  const a=String(r[0]||'').trim(),cRaw=String(r[2]||'').trim();
  const cNum=cRaw===''?null:Number(cRaw);
  const stdMatch=a.match(/^STANDARD\s+([\d.]+)/i);
  if(stdMatch){currentStandard=stdMatch[1];return;}
  if(/^PERATUS SKOR$/i.test(a)){if(cNum!==null&&!isNaN(cNum)&&validStandards.has(currentStandard))out.push({id:currentStandard,level:'standard',score:cNum});return;}
  if(/^\d+(\.\d+){2,}$/.test(a)&&cNum!==null&&!isNaN(cNum)&&validItems.has(a))out.push({id:a,level:'item',score:cNum});
 });
 return out;
}

function modal(title,body,submitText='Simpan',handler){$('#modal').innerHTML=`<form id="modalform"><div class="modalhead"><h2>${title}</h2><button type="button" class="plain" id="closemodal" aria-label="Tutup">${icon('close')}</button></div><div class="modalbody">${body}<div class="error formerror" id="formerror" role="alert"></div></div><div class="modalfoot"><button type="button" id="cancelmodal">Batal</button>${handler?`<button class="primary" type="submit">${submitText}</button>`:''}</div></form>`;$('#closemodal').onclick=$('#cancelmodal').onclick=()=>$('#modal').close();$('#modalform').onsubmit=async ev=>{ev.preventDefault();const btn=$('#modalform button[type=submit]');btn.disabled=true;$('#formerror').textContent='';try{await handler(new FormData(ev.target));$('#modal').close();render();toast('Rekod berjaya disimpan.');}catch(e){$('#formerror').textContent=errorText(e);}finally{btn.disabled=false;}};if(!$('#modal').open)$('#modal').showModal();}

function evidenceForm(existing,initialAspect='',management=false,initialActionIds=[]){let e=existing||{name:'',date:'',category:'Laporan',source:'Pautan dokumen',status:'Draf',unit:'',url:'',management,year};let ms=existing?structuredClone(mappingsFor(e.id)):[];if(initialAspect&&!ms.some(m=>m.aspectId===initialAspect))ms.push({aspectId:initialAspect,actionIds:[...initialActionIds],pdca:[],reference:'',note:''});if(!ms.length&&!management&&!e.management)ms.push({aspectId:CATALOG.standards.find(s=>s.id===selected).aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});

fy-content:space-between;align-items:center;margin:22px 0 13px"><h3>Pemetaan aspek & PDCA</h3><button type="button" id="addmapping">${icon('plus')} Aspek</button></div><p class="smallhint">Pilih tindakan yang dibuktikan. Cadangan PDCA boleh diubah; ia bukan skor rasmi.</p><div id="mappings"></div>`, 'Simpan eviden', async fd=>{
  collectMappings();let url=fd.get('url').trim(),fileName=e.fileName||'',fileId=e.fileId||'';const src=fd.get('source'),isFile=fd.get('management')==='on';
  if(!ms.length&&!isFile)throw Error('Pilih sekurang-kurangnya satu aspek.');

  db=await api('saveEvidence',{id:e.id||'',version:e.version||0,name:fd.get('name').trim(),date:'',category:fd.get('category'),unit:fd.get('unit').trim(),source:src,appId:src==='Aplikasi BASIS'?fd.get('appId'):'',url,fileId,fileName,catatan:fd.get('catatan').trim(),management:isFile,status:'Draf',year:e.year||year,mappings:ms});
 });
 function collectMappings(){ms=$$('.mapping').map(el=>({aspectId:el.querySelector('.mapaspect').value,actionIds:[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value),pdca:[...el.querySelectorAll('.pdcacheck:checked')].map(x=>x.value),reference:'',note:''}));}
 function drawMappings(){$('#mappings').innerHTML=ms.map((m,idx)=>{const a=aspects.find(a=>a.id===m.aspectId)||aspects[0];return `<div class="mapping"><div class="maphead"><span>Pemetaan ${idx+1}</span><button type="button" class="plain removemap" data-index="${idx}">Buang</button></div><label class="field">Aspek<select class="mapaspect">${aspects.map(a=>`<option value="${a.id}" ${a.id===m.aspectId?'selected':''}>${a.id} · ${esc(a.name)}</option>`).join('')}</select></label><div class="field"><span>Tindakan yang disokong *</span><div class="actionlist">${a.items.map(i=>`<p class="smallhint"><b>${i.id}</b> ${esc(i.name)}</p>${i.actions.map(t=>`<label class="check" style="margin:7px 0"><input class="actioncheck" type="checkbox" value="${t.id}" ${m.actionIds.includes(t.id)?'checked':''}>${esc(t.label)}</label>`).join('')}`).join('')}</div></div><div class="checks">${Object.keys(pdcaNames).map(p=>`<label class="check"><input class="pdcacheck" type="checkbox" value="${p}" ${m.pdca.includes(p)?'checked':''}>${p} · ${pdcaNames[p]}</label>`).join('')}</div></div>`;}).join('');$$('.mapaspect').forEach((s,i)=>s.onchange=()=>{collectMappings();ms[i].actionIds=[];ms[i].pdca=[];drawMappings();});$$('.actioncheck').forEach(c=>c.onchange=()=>{const el=c.closest('.mapping');const ids=[...el.querySelectorAll('.actioncheck:checked')].map(x=>x.value);const tags=allActions.filter(a=>ids.includes(a.id)).map(a=>a.pdca);el.querySelectorAll('.pdcacheck').forEach(x=>x.checked=tags.includes(x.value));});$$('.removemap').forEach(b=>b.onclick=()=>{collectMappings();ms.splice(Number(b.dataset.index),1);drawMappings();});}
 $('#addmapping').onclick=()=>{collectMappings();ms.push({aspectId:aspects[0].id,actionIds:[],pdca:[],reference:'',note:''});drawMappings();};drawMappings();
 const setSource=()=>{const s=$('#source').value;$('#appfield').style.display=s==='Aplikasi BASIS'?'grid':'none';$('#filefield').style.display=s==='Muat naik fail'?'grid':'none';$('#urlfield').style.display=(s==='Muat naik fail'||s==='Fail Keras')?'none':'grid';$('#urlfield input').required=false;};$('#source').onchange=setSource;setSource();

function appForm(a={}){modal(a.id?'Ubah aplikasi':'Daftar aplikasi sekolah',`${field('Nama aplikasi *','name',a.name,'required maxlength="120"')}${field('Pautan aplikasi *','url',a.url,'type="url" required placeholder="Tampal pautan di sini"')}<label class="field">Fungsi aplikasi *<textarea name="description" required maxlength="800">${esc(a.description||'')}</textarea></label>`,'Simpan aplikasi',async fd=>{if(!safeURL(fd.get('url')))throw Error('Gunakan pautan HTTPS yang sah.');db=await api('saveApp',{id:a.id||'',name:fd.get('name').trim(),url:fd.get('url'),description:fd.get('description').trim(),owner:a.owner||''});});}
async function readFile(file,limit,imagesOnly=false){const types=imagesOnly?['image/png','image/jpeg','image/webp']:['image/png','image/jpeg','image/webp','application/pdf'];if(!types.includes(file.type))throw Error('Format fail tidak disokong.');if(file.size>limit*1024*1024)throw Error(`Saiz fail melebihi ${limit} MB.`);return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Fail tidak dapat dibaca.'));r.readAsDataURL(file);});}
async function upload(file,limit){const dataUrl=await readFile(file,limit);return api('upload',{name:file.name,mime:file.type,dataUrl});}

ror').textContent=errorText(e);}finally{btn.disabled=false;}};if($('#openAccessToggle'))$('#openAccessToggle').onchange=async e=>{const checked=e.target.checked;e.target.disabled=true;try{db=await api('settings',{school:db.settings.school,code:db.settings.code,year:db.settings.year,logo:db.settings.logo,openAccess:checked});render();toast(checked?'Akses terbuka diaktifkan.':'Akses terbuka dimatikan.');}catch(err){e.target.checked=!checked;e.target.disabled=false;toast(errorText(err));}};
 if($('#rumusanFile'))$('#rumusanFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#rumusanError').textContent='';try{const csv=await f.text();db=await api('importRumusanSkor',{csv});toast(`${(db.rumusanSkor||[]).length} rekod skor diimport.`);render();}catch(err){$('#rumusanError').textContent=errorText(err);e.target.value='';}};

function evidenceSource(e){const app=db.apps.find(a=>a.id===e.appId);if(e.management){const own=safeURL(e.url)||safeURL(app?.url);return {name:'Fail Pengurusan Sistem Kualiti@Sekolah',url:own||setURL('folderUrl'),appUrl:''};}return {name:app?.name||sourceLabel(e.source)||'Dokumen sekolah',url:safeURL(e.url),appUrl:safeURL(app?.url)};}
function files(){const rs=records().filter(e=>e.management);return head('Dokumentasi sekolah','Pengurusan SK@S','Fail pengurusan rasmi daripada Folder Pengurusan Sistem Kualiti@Sekolah.')+`<section class="panel"><div class="panelhead"><h2>Fail daripada folder rasmi</h2><span class="badge gray">${rs.length} fail</span></div><p class="smallhint" style="padding:0 20px">Semua item di bawah dirujuk dalam folder rasmi. Eviden lain dipaparkan di Pengurusan Kami dan Laporan Eviden.</p><div class="formbody">${rs.map(e=>evidenceRow(e)).join('')||'<div class="empty">Belum ada fail pengurusan.</div>'}</div></section>`;}
function strength(){const cards=[['A1','Guru','Data profil guru, pengalaman, jawatan strategik dan kepakaran.'],['A2','Kualiti Pengajaran dan Pembelajaran (PdP)','Data amalan PdP, PLC, e-RPH dan pemantauan instruksional.'],['A3','Staf Bukan Guru','Data kompetensi dan penugasan AKP.'],['A4','Prasarana Akademik','Data bilik khas, PSS, makmal dan sumber pembelajaran.'],['A5','Prasarana Sukan dan Kokurikulum','Data kemudahan, penyertaan dan pencapaian kokurikulum.'],['A6','Prasarana Hal Ehwal Murid','Data asrama, keselamatan, kesihatan dan kebajikan murid.'],['A7','Persekitaran Digital','Data aplikasi sekolah dan dashboard analitik.'],['A8','Asrama','Data pengurusan dan sokongan kehidupan murid asrama.'],['A9','Sokongan Ibu Bapa, Komuniti dan Pihak Swasta','Data jaringan, sumbangan dan kolaborasi strategik.']];return head('Komponen 01','Kekuatan Kami','Paparan berasaskan Instrumen Kekuatan Kami sekolah · '+year)+`<div class="note" style="margin:0 0 20px">${icon('info')}<span>Sumber utama ialah instrumen Kekuatan Kami. Dashboard analitik digunakan untuk pemetaan dan rumusan data; tiada pengisian manual berulang.</span></div><div class="actions" style="margin-bottom:20px">${setURL('strengthUrl')?`<a class="button primary" href="${esc(setURL('strengthUrl'))}" target="_blank" rel="noopener">${icon('sheet')} Buka instrumen</a>`:''}${setURL('dashboardUrl')?`<a class="button" href="${esc(setURL('dashboardUrl'))}" target="_blank" rel="noopener">${icon('chart')} Buka dashboard analitik</a>`:''}</div><div class="grid2">${cards.map(([code,n,d])=>`<section class="panel introcard"><span class="badge green">${code}</span><h3 style="margin-top:12px">${n}</h3><p>${d}</p><span class="smallhint">Data disemak daripada instrumen sumber</span></section>`).join('')}</div>`;}
</script>
